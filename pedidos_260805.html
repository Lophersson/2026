

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumo de Compras por Clienta</title>

<style>
  :root{
    --paper:#F6EFE4;
    --ink:#1c1a16;
    --ink-dim:#6b6355;
    --line:#1c1a16;
    --gold:#a9752c;
    --card:#ffffff;
    --green:#3f7a3f;
    --amber:#a9752c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    padding:24px 16px 80px;
  }
  header{
    max-width:760px;
    margin:0 auto 28px;
    text-align:center;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:36px;
    margin:0 0 4px;
    letter-spacing:0.02em;
  }
  .sub{
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .top-actions{
    max-width:760px;
    margin:0 auto 20px;
    display:flex;
    justify-content:center;
  }
  .top-actions button{
    font-family:'DM Sans', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 18px;
    border-radius:5px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  .top-actions button:hover{
    background:var(--paper);
    color:var(--ink);
  }
  .grand-totals{
    max-width:760px;
    margin:0 auto 28px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .grand-totals .gt-card{
    flex:1;
    min-width:160px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:6px;
    padding:12px 16px;
    text-align:center;
  }
  .grand-totals .gt-label{
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:4px;
  }
  .grand-totals .gt-value{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:26px;
    color:var(--ink);
  }
  .grand-totals .gt-card.final{
    background:var(--ink);
    border-color:var(--ink);
  }
  .grand-totals .gt-card.final .gt-label{
    color:#d9cdb2;
  }
  .grand-totals .gt-card.final .gt-value{
    color:var(--paper);
  }
  #container{
    max-width:760px;
    margin:0 auto;
  }
  .client-card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:6px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .client-card .head{
    background:var(--ink);
    color:var(--paper);
    padding:12px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .client-card .head .cname{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:21px;
  }
  .client-card .head .csub{
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:#d9cdb2;
  }
  .client-card .items{
    padding:14px 18px 4px;
  }
  .client-card .item-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:5px 0;
    border-bottom:1px dashed #e0d5bd;
  }
  .client-card .item-row .iname{ color:var(--ink); }
  .client-card .item-row .isize{
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    margin-left:6px;
  }
  .client-card .item-row .iprice{
    font-family:'DM Mono', monospace;
    white-space:nowrap;
    padding-left:10px;
  }
  .client-card .totals{
    padding:12px 18px 14px;
    font-family:'DM Mono', monospace;
    font-size:13px;
  }
  .client-card .totals .trow{
    display:flex;
    justify-content:space-between;
    padding:2px 0;
  }
  .client-card .totals .trow.sub{ color:var(--ink-dim); }
  .client-card .totals .trow.final{
    font-weight:700;
    font-size:14px;
    border-top:1px solid var(--line);
    margin-top:4px;
    padding-top:6px;
  }
  .client-card .totals .trow.internal{
    color:var(--amber);
    font-style:italic;
  }
  .client-card .totals .internal-tag{
    font-family:'DM Sans', sans-serif;
    font-size:9px;
    font-style:normal;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:#f1e4c9;
    color:var(--amber);
    border-radius:3px;
    padding:1px 5px;
    margin-left:6px;
  }
  .client-card .copy-row{
    display:flex;
    gap:10px;
    padding:0 18px 18px;
    flex-wrap:wrap;
  }
  .client-card .copy-row button{
    flex:1;
    min-width:160px;
    font-family:'DM Sans', sans-serif;
    font-size:12px;
    font-weight:700;
    padding:9px 10px;
    border-radius:4px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .client-card .copy-row button:hover{
    background:var(--ink);
    color:var(--paper);
  }
  .client-card .copy-row button.copied{
    background:var(--green);
    color:#fff;
    border-color:var(--green);
  }

  /* ---- Modal: vista por artigo ---- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(28,26,22,0.55);
    z-index:100;
    padding:24px 12px;
    overflow-y:auto;
  }
  .modal-overlay.open{ display:block; }
  .modal{
    max-width:760px;
    margin:0 auto;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:8px;
    overflow:hidden;
  }
  .modal-head{
    background:var(--ink);
    color:var(--paper);
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
  }
  .modal-head h2{
    font-family:'Cormorant Garamond', serif;
    font-size:24px;
    margin:0;
  }
  .modal-head .modal-close{
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    background:transparent;
    border:1px solid var(--paper);
    color:var(--paper);
    border-radius:4px;
    padding:6px 12px;
    cursor:pointer;
  }
  .modal-head .modal-close:hover{
    background:var(--paper);
    color:var(--ink);
  }
  .modal-body{
    padding:16px 20px 24px;
  }
  .article-group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .article-group .ag-head{
    background:#efe4cd;
    padding:9px 16px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:6px;
  }
  .article-group .ag-head .agname{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:17px;
  }
  .article-group .ag-head .agcount{
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
  }
  .article-group .ag-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    padding:7px 16px;
    border-bottom:1px dashed #e0d5bd;
    gap:8px;
    flex-wrap:wrap;
  }
  .article-group .ag-row:last-child{ border-bottom:none; }
  .article-group .ag-row .agclient{
    color:var(--ink);
    font-weight:500;
  }
  .article-group .ag-row .agsize{
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    margin-left:6px;
  }
  .article-group .ag-row .agnums{
    font-family:'DM Mono', monospace;
    font-size:12px;
    white-space:nowrap;
    color:var(--ink-dim);
  }
  .article-group .ag-row .agnums b{
    color:var(--amber);
    font-weight:700;
  }
</style>

// ---- Texto que se copia: informação apenas para a clienta (sem comissões separadas) ----
function buildCopyText(clientName, items, subtotal, portes){
  const lines = items.map(u => {
    const total = u.price + u.comm;
    return u.size
      ? `#${u.num} ${u.name} — ${u.size} — ${fmt(total)}`
      : `#${u.num} ${u.name} — ${fmt(total)}`;
  });
  const total = subtotal + portes;
  return `Resumo de compra — ${clientName}

${lines.join('\n')}

Subtotal artigos: ${fmt(subtotal)}
Portes: ${fmt(portes)}
Total a pagar: ${fmt(total)}

${PAYMENT_INFO}`;
}

function copyToClipboard(text, btn){
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = 'Copiado ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1600);
  }).catch(() => {
    alert('Não foi possível copiar automaticamente. Copia manualmente o texto.');
  });
}

const container = document.getElementById('container');

// ---- Totais gerais (todas as clientas) ----
const grandArticles = clients.reduce((s, c) => s + c.items.reduce((si, u) => si + u.price, 0), 0);
const grandComm = clients.reduce((s, c) => s + c.items.reduce((si, u) => si + u.comm, 0), 0);
const grandTotal = grandArticles + grandComm;

const grandTotalsDiv = document.getElementById('grandTotals');

`;

  const card = document.createElement('div');

  `;

  const btnB = document.createElement('button');

  btnB.addEventListener('click', () => copyToClipboard(buildCopyText(client.name, items, subtotal, PORTES_B), btnB));

  copyRow.append(btnA, btnB);
  card.appendChild(copyRow);

// ---- Vista por artigo: quem comprou cada artigo, ordenado por número ascendente ----
function buildArticlesView(){
  const groups = {};
  clients.forEach(client => {
    client.items.forEach(u => {
      if(!groups[u.num]){
        groups[u.num] = { name:u.name, entries:[] };
      }
      groups[u.num].entries.push({
        client: client.name,
        size: u.size,
        price: u.price,
        comm: u.comm
      });
    });
  });

  const orderedNums = Object.keys(groups).map(Number).sort((a,b) => a - b);

  const body = document.getElementById('articlesBody');
  body.innerHTML = orderedNums.map(num => {
    const g = groups[num];
    const rows = g.entries.map(e => {
      const total = e.price + e.comm;
      return `
        <div class="ag-row">
          <span class="agclient">${e.client}${e.size ? `<span class="agsize">${e.size}</span>` : ''}</span>
          <span class="agnums">${fmt(e.price)} + ${fmt(e.comm)} = <b>${fmt(total)}</b></span>
        </div>`;
    }).join('');
    return `
      <div class="article-group">
        <div class="ag-head">
          <span class="agname">#${num} ${g.name}</span>
          <span class="agcount">${g.entries.length} venda${g.entries.length>1?'s':''}</span>
        </div>
        ${rows}
      </div>`;
  }).join('');
}

buildArticlesView();

document.getElementById('closeArticlesBtn').addEventListener('click', () => overlay.classList.remove('open'));
