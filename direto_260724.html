<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIRETO — 24 Julho 2026</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#ffffff;
    --panel:#ffffff;
    --gold:#000000;
    --gold-dim:#333333;
    --ink:#000000;
    --ink-dim:#555555;
    --red:#c62b32;
    --line:#000000;
    --card-bg:#ffffff;
    --card-ink:#000000;
    --detail-size: clamp(22px, 4.4vw, 50px);
    --detail-label-size: clamp(16px, 3vw, 24px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 12px;
    overflow:hidden;
  }

  .stage{
    width:100%;
    max-width:99vw;
    height:100%;
    max-height:98vh;
    max-height:98dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  header{
    width:100%;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
    margin-bottom:clamp(6px, 1.8vh, 16px);
  }
  .clock{
    position:absolute;
    top:0;
    right:0;
    text-align:right;
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    line-height:1.5;
    text-transform:uppercase;
  }
  .clock .time{
    color:var(--ink);
    font-size:13px;
    font-weight:700;
  }
  .title-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .live-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px 2px rgba(198,43,50,0.5);
    animation:dotpulse 1.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes dotpulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.35; transform:scale(0.8);}
  }
  h1.directo{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(26px, 4.6vh, 54px);
    letter-spacing:0.14em;
    margin:0;
    color:var(--ink);
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,45%,100%{opacity:1;}
    50%,90%{opacity:0.22;}
  }
  .subline{
    font-family:'DM Mono', monospace;
    font-size:clamp(12px, 2.4vw, 20px);
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:2px;
    text-align:center;
  }

  main{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    touch-action: pan-y;
  }

  .ficha-wrap{
    width:100%;
    max-width:none;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:stretch;
    user-select:none;
  }

  table.ficha{
    width:100%;
    border-collapse:collapse;
    border:5px solid var(--line);
    table-layout:fixed;
    background:var(--card-bg);
    color:var(--card-ink);
  }
  table.ficha td{
    border:5px solid var(--line);
    padding:0;
  }
  .num-cell{
    width:28%;
    text-align:center;
    vertical-align:middle;
    padding:5px;
  }
  .num-cell .num{
    font-family:'DM Mono', monospace;
    font-weight:700;
    font-size:clamp(370px, 15vh, 150px);
    line-height:1;
    color: black;
    letter-spacing:-0.02em;
  }
  .name-cell{
    text-align:center;
    vertical-align:middle;
    padding:clamp(10px, 2vh, 22px) 30px;
  }
  .name-cell .art-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:var(--detail-size);
    line-height:1.1;
    outline:none;
    display:block;
    color: black;
    font-style:normal;
  }
  .price-cell{
    text-align:center;
    vertical-align:middle;
    padding:clamp(8px, 1.6vh, 16px) 20px;
    font-family:'DM Mono', monospace;
  }
  .price-cell .row{
    display:flex;
    justify-content:space-between;
    font-size:clamp(18px, 3.2vw, 30px);
    padding:clamp(2px, 0.6vh, 6px) 6px;
    color:#000000;
  }
  .price-cell .row span:last-child{
    outline:none;
    min-width:70px;
    text-align:right;
  }
  .price-cell .row.total{
    margin-top:clamp(4px, 0.8vh, 8px);
    padding-top:clamp(6px, 1vh, 10px);
    border-top:2px solid var(--card-ink);
    font-weight:700;
    font-size:clamp(18px, 3.2vw, 30px);
    color:var(--card-ink);
  }

  .details-cell{
    padding:clamp(8px, 1.6vh, 16px) 20px;
    font-family:'DM Mono', monospace;
    vertical-align:middle;
  }
  .details-grid{
    display:flex;
    gap:18px;
    align-items:stretch;
  }
  .details-block{
    flex:1 1 0;
    text-align:center;
  }
  .details-block + .details-block{
    border-left:2px solid var(--card-ink);
    padding-left:18px;
  }
  .details-label{
    font-size:var(--detail-label-size);
    letter-spacing:0.0em;
    color:var(--ink-dim);
    margin-bottom:4px;
  }
  .details-value{
    font-size:var(--detail-size);
    font-weight:700;
    color:var(--card-ink);
    line-height:1.1;
  }
  .sizes-list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px 12px;
    font-size:var(--detail-size);
    color:black;
    line-height:1.1;
  }
  .sizes-list .size-chip b{
    color: red;
  }
  .sizes-list .size-chip b::after {
  content: ";";
}
  .sizes-empty{
    font-size:var(--detail-size);
    color:var(--ink-dim);
  }

  [contenteditable="true"]:focus{
    background:rgba(0,0,0,0.06);
  }

  .controls{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:14px 22px;
    flex:0 0 auto;
    margin-top:clamp(14px, 2vh, 40px);
    width:100%;
  }

  .nav {
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex:0 0 auto;
    height:auto;
  }
  .arrow-btn {
    width:70px;
    height:70px;
    flex-shrink:0;
    border-radius:10px;
    border:3px solid #000000;
    background:transparent;
    color:#000000;
    font-size:32px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.18s, transform 0.12s;
    touch-action:manipulation;
  }
  .arrow-btn:hover { background: rgba(0,0,0,0.08); }
  .arrow-btn:active { transform: scale(0.92); background: rgba(0,0,0,0.12); }
  .arrow-btn:disabled { opacity: 0.25; cursor: default; }
  .arrow-btn:disabled:hover { background: transparent; }

  .position {
    font-family: 'DM Mono', monospace;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    min-width: 80px;
    text-align: center;
    flex-shrink: 0;
  }
  .position b { color: #000000; font-size:30px; }

  .jump {
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    align-items:center;
    gap:10px;
    font-family:'DM Mono', monospace;
    font-size:22px;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  .jump input {
    width:90px;
    height:56px;
    background:#ffffff;
    border:3px solid #000000;
    color:#000000;
    font-family:'DM Mono', monospace;
    font-size:24px;
    padding:4px 8px;
    text-align:center;
    border-radius:8px;
  }
  .jump button {
    background:#000000;
    border:3px solid #000000;
    color:#ffffff;
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:0 20px;
    border-radius:8px;
    cursor:pointer;
    height:56px;
    display:flex;
    align-items:center;
    transition:opacity 0.15s, transform 0.12s;
  }
  .jump button:hover { opacity:0.8; }
  .jump button:active { transform:scale(0.94); }

  .swipe-hint{
    font-family:'DM Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--ink-dim);
    text-align:center;
    margin-top:6px;
    opacity:0.7;
    display:none;
  }

  @media (max-width: 900px){
    :root{
      --detail-size: clamp(18px, 4.6vw, 34px);
      --detail-label-size: clamp(13px, 2.6vw, 18px);
    }
    .num-cell .num{ font-size:clamp(54px, 16vh, 110px); }
    table.ficha{ border-width:4px; }
    table.ficha td{ border-width:4px; }
  }

  @media (max-width: 640px){
    body{ padding:8px 8px; }
    .stage{ max-height:99dvh; }
    .clock{ font-size:9px; }
    .clock .time{ font-size:11px; }
    h1.directo{ font-size:clamp(20px, 7vw, 30px); letter-spacing:0.1em; }
    .subline{ font-size:11px; letter-spacing:0.16em; }

    :root{
      --detail-size: clamp(15px, 5vw, 24px);
      --detail-label-size: clamp(11px, 3vw, 15px);
    }

    table.ficha{ border-width:3px; }
    table.ficha td{ border-width:3px; }
    .num-cell{ width:30%; padding:3px; }
    .num-cell .num{ font-size:clamp(42px, 20vw, 80px); }
    .name-cell{ padding:8px 8px; }
    .price-cell{ padding:6px 8px; }
    .price-cell .row{ font-size:clamp(13px, 4vw, 18px); padding:2px 3px; }
    .price-cell .row.total{ font-size:clamp(14px, 4.4vw, 19px); }
    .details-cell{ padding:6px 8px; }
    .details-grid{ flex-direction:column; gap:6px; }
    .details-block + .details-block{ border-left:none; border-top:1px solid var(--card-ink); padding-left:0; padding-top:6px; }

    .controls{ gap:10px 12px; margin-top:10px; }
    .nav{ gap:10px; }
    .arrow-btn{ width:58px; height:58px; font-size:26px; border-radius:8px; }
    .position{ font-size:16px; min-width:56px; }
    .position b{ font-size:19px; }
    .jump{ font-size:14px; gap:6px; }
    .jump input{ width:66px; height:48px; font-size:18px; }
    .jump button{ height:48px; font-size:14px; padding:0 14px; }

    .swipe-hint{ display:block; }
  }

  @media (max-width: 360px){
    .controls{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <div class="clock">
      <div class="date" id="dateOut">—</div>
      <div class="time" id="timeOut">—</div>
    </div>
    <div class="title-row">
      <span class="live-dot"></span>
      <h1 class="directo">DIRETO</h1>
    </div>
    <div class="subline">Emissão em curso 24 julho 2026</div>
  </header>

  <main>
    <div class="ficha-wrap" id="fichaWrap">
      <table class="ficha">
        <tr>
          <td class="num-cell" rowspan="3"><span class="num" id="numOut">30</span></td>
          <td class="name-cell"><span class="art-name" contenteditable="true" id="nameOut">Nome do artigo</span></td>
        </tr>
        <tr>
          <td class="price-cell">
            <div class="row"><span>Preço</span><span contenteditable="true" id="priceOut">0,00 €</span></div>
            <div class="row"><span>Comissão</span><span contenteditable="true" id="commOut">0,00 €</span></div>
            <div class="row total"><span>Total a pagar</span><span id="totalOut">0,00 €</span></div>
          </td>
        </tr>
        <tr>
          <td class="details-cell">
            <div class="details-grid">
              <div class="details-block">
                <div class="details-label">Cor</div>
                <div class="details-value" id="colorOut">—</div>
              </div>
              <div class="details-block">
                <div class="details-label">units</div>
                <div class="details-value" id="unitsOut">1</div>
              </div>
              <div class="details-block" style="flex:2 1 0;">
                <div class="details-label">Tallas</div>
                <div class="sizes-list" id="sizesOut"></div>
              </div>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <div class="swipe-hint">← deslize para navegar →</div>

 <div class="controls">
    <div class="nav">
      <button class="arrow-btn" id="prevBtn" aria-label="Ficha anterior">←</button>
      <div class="position"><b id="posOut">1</b> / <span id="countOut">34</span></div>
      <button class="arrow-btn" id="nextBtn" aria-label="Ficha seguinte">→</button>
    </div>

    <div class="jump">
      <span>Ir ao nº</span>
      <input type="number" id="jumpInput" min="30" max="72" value="30" inputmode="numeric">
      <button id="jumpBtn">Ir</button>
    </div>
    </div>
  </main>
</div>

<script>
  // ---- Relógio em direto ----
  const dateOut = document.getElementById('dateOut');
  const timeOut = document.getElementById('timeOut');
  function tickClock(){
    const now = new Date();
    dateOut.textContent = now.toLocaleDateString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric' });
    timeOut.textContent = now.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---- Dados das fichas (30 → 72) ----
  const datos = {
    30: { name:'Sapatilhas Minnie', price:5.00, comm:2.00, color:'—', sizes:[
      {s:'Nº22',q:1}, {s:'Nº28',q:1}, {s:'Nº24',q:1}
    ]},
    31: { name:'Calças Bege', price:3.00, comm:2.00, color:'—', sizes:[
      {s:'M',q:2}, {s:'L',q:1}
    ]},
    32: { name:'Esponjas de Maquiagem', price:0.99, comm:0.99, color:'—', sizes:[
      {s:'Vermelho',q:1}, {s:'Roxo',q:2}
    ]},
    33: { name:'Meias Hello Kitty', price:3.00, comm:2.00, color:'—', sizes:[
      {s:'3/6',q:1}, {s:'7/10',q:1}
    ]},
    34: { name:'Meias Stitch', price:2.00, comm:1.50, color:'—', sizes:[
      {s:'3/6a',q:2}, {s:'2/3a',q:1}
    ]},
    36: { name:'Estojo Borboletas', price:5.00, comm:2.00, color:'—', sizes:[], units:2 },
    37: { name:'Rede banho brinquedos crianças', price:3.00, comm:2.00, color:'—', sizes:[
      {s:'Patrulha',q:2}
    ]},
    38: { name:'Livro Squishmallow', price:1.60, comm:1.00, color:'—', sizes:[], units:2 },
    41: { name:'Livro Comboio', price:0.70, comm:0.70, color:'—', sizes:[], units:2 },
    43: { name:'Garrafa', price:2.00, comm:1.50, color:'—', sizes:[
      {s:'Rosa',q:3}, {s:'Azul',q:2}
    ]},
    44: { name:'Puzzle Dora', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
    45: { name:'Puzzle Gabi', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
    46: { name:'Puzzle Pooh', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
    47: { name:'Puzzle Spidey', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
    48: { name:'Kit Face Serum + Fruit Bar', price:2.99, comm:2.00, color:'—', sizes:[], units:4 },
    49: { name:'Kit Hidratante', price:1.00, comm:1.00, color:'—', sizes:[], units:3 },
    50: { name:'Máscara de Olhos', price:0.50, comm:0.50, color:'—', sizes:[], units:18 },
    51: { name:'Pijama Pooh', price:4.00, comm:2.00, color:'—', sizes:[], units:1 },
    54: { name:'Camisola Stitch', price:2.00, comm:1.50, color:'—', sizes:[], units:2 },
    55: { name:'Conjunto Playstation', price:4.00, comm:2.00, color:'—', sizes:[
      {s:'8/9',q:2}, {s:'5/6',q:1}
    ]},
    56: { name:'Conjunto Minecraft', price:6.00, comm:2.00, color:'—', sizes:[
      {s:'10/11',q:1}, {s:'11/12',q:1}
    ]},
    57: { name:'Kit Guerreira do K-pop', price:3.99, comm:2.00, color:'—', sizes:[], units:9 },
    58: { name:'Pijama Minnie', price:3.00, comm:2.00, color:'—', sizes:[
      {s:'19/21',q:1}, {s:'24/36',q:1}
    ]},
    59: { name:'Conjunto Biscoitos', price:4.00, comm:2.00, color:'—', sizes:[
      {s:'24/30',q:1}
    ]},
    60: { name:'Meias Pretas', price:2.00, comm:1.50, color:'—', sizes:[
      {s:'2/3a',q:1}
    ]},
    61: { name:'Meias Rosa, Branca, Cinzenta', price:2.00, comm:1.50, color:'—', sizes:[
      {s:'3/4',q:1}, {s:'4/5',q:3}, {s:'7/8',q:1}
    ]},
    63: { name:'Conjunto Pijama Minnie Margarida', price:3.00, comm:2.00, color:'—', sizes:[], units:1 },
    64: { name:'Luvas Frozen', price:3.00, comm:2.00, color:'—', sizes:[], units:1 },
    65: { name:'Pijama Pooh', price:10.00, comm:2.00, color:'—', sizes:[], units:1 },
    67: { name:'Puzzle Stitch', price:1.99, comm:1.00, color:'—', sizes:[], units:2 },
    69: { name:'Puzzle Homem de Ferro', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
    70: { name:'Puzzle Mickey', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
    71: { name:'Puzzle Hot Wheels', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
    72: { name:'Puzzle Rapunzel', price:1.99, comm:1.00, color:'—', sizes:[], units:1 },
  };

  // ---- Constrói a lista de fichas a partir de "datos" ----
  const fichas = Object.keys(datos)
    .map(Number)
    .sort((a, b) => a - b)
    .map(num => {
      const d = datos[num];
      const sizes = d.sizes || [];
      const units = (typeof d.units === 'number')
        ? d.units
        : (sizes.length ? sizes.reduce((sum, sz) => sum + sz.q, 0) : 1);
      return {
        num,
        name: d.name,
        price: d.price,
        comm: d.comm,
        color: d.color || '—',
        sizes,
        units
      };
    });

  let idx = 0;

  const numOut = document.getElementById('numOut');
  const nameOut = document.getElementById('nameOut');
  const priceOut = document.getElementById('priceOut');
  const commOut = document.getElementById('commOut');
  const totalOut = document.getElementById('totalOut');
  const colorOut = document.getElementById('colorOut');
  const unitsOut = document.getElementById('unitsOut');
  const sizesOut = document.getElementById('sizesOut');
  const posOut = document.getElementById('posOut');
  const countOut = document.getElementById('countOut');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const jumpInput = document.getElementById('jumpInput');
  const jumpBtn = document.getElementById('jumpBtn');
  const fichaWrap = document.getElementById('fichaWrap');

  countOut.textContent = fichas.length;

  function parseMoney(str){
    const clean = str.replace(/[^\d,.-]/g,'').replace(',', '.');
    const val = parseFloat(clean);
    return isNaN(val) ? 0 : val;
  }
  function fmtMoney(val){
    return val.toLocaleString('pt-PT', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
  }

  function saveCurrentEdits(){
    const f = fichas[idx];
    const html = nameOut.innerHTML.trim();
    f.name = html || 'Nome do artigo';
    f.price = parseMoney(priceOut.textContent);
    f.comm = parseMoney(commOut.textContent);
  }

  function renderSizes(sizes){
    sizesOut.innerHTML = '';
    if(!sizes || sizes.length === 0){
      const span = document.createElement('span');
      span.className = 'sizes-empty';
      span.textContent = 'Sem tallas (talla única)';
      sizesOut.appendChild(span);
      return;
    }
    sizes.forEach(sz => {
      const chip = document.createElement('span');
      chip.className = 'size-chip';
      chip.innerHTML = sz.s + '<b>x' + sz.q + '</b>';
      sizesOut.appendChild(chip);
    });
  }

  function render(){
    const f = fichas[idx];
    numOut.textContent = f.num;
    nameOut.innerHTML = f.name;
    priceOut.textContent = fmtMoney(f.price);
    commOut.textContent = fmtMoney(f.comm);
    totalOut.textContent = fmtMoney(f.price + f.comm);
    colorOut.textContent = f.color;
    unitsOut.textContent = f.units;
    renderSizes(f.sizes);
    posOut.textContent = idx + 1;
    jumpInput.value = f.num;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === fichas.length - 1;
  }

  function goTo(newIdx){
    saveCurrentEdits();
    idx = Math.max(0, Math.min(fichas.length - 1, newIdx));
    render();
  }

  prevBtn.addEventListener('click', () => goTo(idx - 1));
  nextBtn.addEventListener('click', () => goTo(idx + 1));

  jumpBtn.addEventListener('click', () => {
    const target = parseInt(jumpInput.value, 10);
    if(!isNaN(target)){
      const found = fichas.findIndex(f => f.num === target);
      if(found !== -1) goTo(found);
    }
  });

  jumpInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      jumpBtn.click();
    }
  });

  [priceOut, commOut].forEach(el => {
    el.addEventListener('input', () => {
      const p = parseMoney(priceOut.textContent);
      const c = parseMoney(commOut.textContent);
      totalOut.textContent = fmtMoney(p + c);
    });
  });

  nameOut.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      document.execCommand('insertLineBreak');
    }
  });

  document.addEventListener('keydown', (e) => {
    if(document.activeElement === nameOut || document.activeElement === priceOut || document.activeElement === commOut) return;
    if(e.key === 'ArrowLeft') goTo(idx - 1);
    if(e.key === 'ArrowRight') goTo(idx + 1);
  });

  // ---- Swipe tátil (esquerda/direita) para navegar entre fichas ----
  let touchStartX = 0;
  let touchStartY = 0;
  let touchActive = false;
  const SWIPE_THRESHOLD = 45;
  const SWIPE_MAX_OFFAXIS = 80;

  function isEditableTarget(target){
    return target === nameOut || target === priceOut || target === commOut ||
           (target && target.closest && target.closest('[contenteditable="true"]'));
  }

  fichaWrap.addEventListener('touchstart', (e) => {
    if(isEditableTarget(e.target)) { touchActive = false; return; }
    touchActive = true;
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive:true });

  fichaWrap.addEventListener('touchend', (e) => {
    if(!touchActive) return;
    touchActive = false;
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;
    if(Math.abs(diffX) > SWIPE_THRESHOLD && Math.abs(diffY) < SWIPE_MAX_OFFAXIS){
      if(diffX < 0){
        goTo(idx + 1);
      } else {
        goTo(idx - 1);
      }
    }
  }, { passive:true });

  document.addEventListener('touchstart', (e) => {
    if(fichaWrap.contains(e.target)) return;
    if(isEditableTarget(e.target)) { touchActive = false; return; }
    touchActive = true;
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive:true });

  document.addEventListener('touchend', (e) => {
    if(fichaWrap.contains(e.target)) return;
    if(!touchActive) return;
    touchActive = false;
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;
    if(Math.abs(diffX) > SWIPE_THRESHOLD && Math.abs(diffY) < SWIPE_MAX_OFFAXIS){
      if(diffX < 0){
        goTo(idx + 1);
      } else {
        goTo(idx - 1);
      }
    }
  }, { passive:true });

  render();
</script>
</body>
</html>
