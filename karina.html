<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateliê da Karina · Painel de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:      #fdf7f2;
    --rosa:       #f6c9d3;
    --rosa-forte: #e8a3b5;
    --menta:      #bfe6dc;
    --menta-forte:#4f9c86;
    --texto:      #5c4a52;
    --texto-suave:#8a7783;
    --branco:     #fffdfb;
    --sombra:     0 10px 30px -12px rgba(150, 110, 130, 0.28);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Nunito', sans-serif;
    color:var(--texto);
    background:
      radial-gradient(circle at 8% 12%, rgba(217,205,240,0.4), transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(191,230,220,0.5), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(249,220,196,0.45), transparent 55%),
      var(--creme);
    min-height:100vh;
    padding:40px 20px 56px;
  }

  .capa{ max-width:1080px; margin:0 auto; }

  .assinatura{
    text-align:center;
    margin-bottom:34px;
  }
  .assinatura .etiqueta{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--branco);
    border:1px solid rgba(232,163,181,0.5);
    padding:6px 18px; border-radius:999px;
    font-size:0.78rem; letter-spacing:0.04em;
    color:var(--rosa-forte); font-weight:700;
    box-shadow:var(--sombra);
  }
  .assinatura .etiqueta::before{
    content:""; width:8px; height:8px; border-radius:50%;
    background:var(--rosa-forte); display:inline-block;
  }
  .assinatura h1{
    font-family:'Fredoka', sans-serif; font-weight:600;
    font-size:clamp(1.7rem, 4vw, 2.4rem);
    color:#7a5566; margin-top:16px;
  }

  .titulo-secao{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.7rem;
    color:#6f5261;
    margin-bottom:6px;
  }
  .desc-secao{
    color:var(--texto-suave);
    font-size:0.95rem;
    margin-bottom:26px;
  }

  .grade{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:18px;
  }

  .card{
    --fase-cor: var(--menta-forte);
    background:var(--branco);
    border-radius:20px;
    padding:22px 20px;
    text-decoration:none;
    color:var(--texto);
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:var(--sombra);
    border:1px solid rgba(0,0,0,0.03);
    position:relative;
    overflow:hidden;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:var(--fase-cor); opacity:0.75;
  }
  .card:hover{ transform:translateY(-5px); box-shadow:0 18px 34px -14px rgba(150,110,130,0.38); }
  .card:focus-visible{ outline:3px solid var(--fase-cor); outline-offset:3px; }

  .card .rotulo{
    font-size:0.72rem; letter-spacing:0.04em; color:var(--texto-suave); font-weight:700;
  }
  .card .data{
    font-family:'Fredoka', sans-serif; font-size:1.35rem; font-weight:600; color:#6f5261;
  }
  .card .ano{ font-size:0.85rem; color:var(--texto-suave); font-weight:600; margin-top:-6px; }
  .card .seta{
    margin-top:6px; font-size:0.85rem; font-weight:700; color:var(--fase-cor);
    display:flex; align-items:center; gap:6px;
  }
  .card:hover .seta{ gap:10px; }
  .seta svg{ transition:transform 0.2s ease; }
  .card:hover .seta svg{ transform:translateX(3px); }

  footer{
    text-align:center; color:var(--texto-suave); font-size:0.85rem; margin-top:46px;
  }
  footer strong{ color:var(--rosa-forte); }

  @media (prefers-reduced-motion: reduce){
    .card, .seta svg{ transition:none; }
  }
</style>
</head>
<body>

<div class="capa">

  <div class="assinatura">
    <span class="etiqueta">Ateliê da Karina</span>
    <h1>Painel de Vendas Online</h1>
  </div>

  <section id="pedidos">
    <h2 class="titulo-secao">Pedidos</h2>
    <p class="desc-secao">Faturas recebidas pelas clientas · <span id="contagem-pedidos"></span></p>
    <div class="grade" id="grade-pedidos"></div>
  </section>

  <footer>Feito com carinho de @Lophersson para <strong>Karina</strong> 💐</footer>

</div>

<script>
  const setaSvg = '<svg width="14" height="10" viewBox="0 0 14 10"><path d="M0 5 H12 M8 1 L12 5 L8 9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // datas [dia, mes-abreviado, ano]
  const datas = [
    ["07","Out","2026"], ["04","Out","2026"],
    ["01","Out","2026"], ["27","Set","2026"], ["24","Set","2026"], ["20","Set","2026"],
    ["18","Set","2026"], ["16","Set","2026"], ["30","Ago","2026"],
    ["27","Ago","2026"], ["23","Ago","2026"], ["21","Ago","2026"],
    ["19","Ago","2026"], ["16","Ago","2026"], ["14","Ago","2026"],
    ["12","Ago","2026"], ["10","Ago","2026"], ["07","Ago","2026"],
    ["05","Ago","2026"], ["02","Ago","2026"], ["31","Jul","2026"],
    ["29","Jul","2026"], ["24","Jul","2026"]
  ];

  const mesNumero = { Jul:"07", Ago:"08", Set:"09", Out:"10" };

  function slug(dia, mes, ano){
    return ano.slice(2) + mesNumero[mes] + dia;
  }

  const container = document.getElementById("grade-pedidos");
  let html = "";
  datas.forEach(([dia, mes, ano]) => {
    const url = `https://lophersson.github.io/2026/pedidos_${slug(dia, mes, ano)}.html`;
    html += `
      <a class="card" href="${url}" target="_blank" rel="noopener">
        <span class="rotulo">Pedidos</span>
        <span class="data">${dia} ${mes}</span>
        <span class="ano">${ano}</span>
        <span class="seta">Ver faturas ${setaSvg}</span>
      </a>`;
  });
  container.innerHTML = html;

  document.getElementById("contagem-pedidos").textContent = datas.length + " faturas";
</script>

</body>
</html>
