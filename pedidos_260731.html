function fmt(n){ return n.toFixed(2).replace(".", ","); }
function unitPrice(article){ return (article.price||[]).reduce((a,b)=>a+b,0); }
function commissionPerUnit(article){ return article.price && article.price.length>1 ? article.price[1] : 0; }
const PORTES_1 = 5.40;
const PORTES_2 = 8.93;

function clearArticleSearch(){
  document.getElementById('articleSearch').value = '';
  renderArticleView();
}

// ---- Render vista por artigo (com filtro de busca) ----
function renderArticleView(){
  const searchInput = document.getElementById('articleSearch');
  const query = searchInput ? searchInput.value.trim().toLowerCase() : '';

  const articles = query
    ? data.filter(a => a.title.toLowerCase().includes(query) || String(a.num).includes(query))
    : data;

  const countEl = document.getElementById('articleSearchCount');
  if(query){
    countEl.textContent = `${articles.length} artigo(s) encontrado(s)`;
  } else {
    countEl.textContent = '';
  }

  const el = document.getElementById('articleResults');
  let html = '';
  if(articles.length === 0){
    html = `<p class="empty">Nenhum artigo encontrado</p>`;
  } else {
    articles.forEach(a=>{
      const priceLabel = a.price.length ? ` (${a.price.map(p=>fmt(p)).join('+')})` : '';
      html += `<div class="article"><div class="article-title"><span class="article-num">${a.num}</span> — ${a.title}<span class="price">${priceLabel}</span></div>`;
      const active = a.clients.filter(c=>!c.cancelled);
      if(active.length===0){
        html += `<p class="empty">Sem pedidos registados</p>`;
      } else {
        html += '<ol>';
        a.clients.forEach(c=>{
          const strike = c.cancelled ? 'text-decoration:line-through;' : '';
          const repeat = c.qty || 1;
          for(let i=0;i<repeat;i++){
            html += `<li style="${strike}">${c.name}${c.detail ? ` <span class="detail">— ${c.detail}</span>` : ''}</li>`;
          }
        });
        html += '</ol>';
      }
      html += '</div>';
    });
  }
  el.innerHTML = html;
}

// ---- Calcula totais por clienta ----
function computeClientTotals(){
  const totals = {};
  data.forEach(a=>{
    const up = unitPrice(a);
    const cp = commissionPerUnit(a);
    a.clients.forEach(c=>{
      if(c.cancelled) return;
      const qty = c.qty || 1;
      if(!totals[c.name]) totals[c.name] = {items:[], total:0, commission:0};
      totals[c.name].items.push({title:a.title, num:a.num, detail:c.detail, qty:qty, lineTotal: up*qty, unitPrice: up});
      totals[c.name].total += up*qty;
      totals[c.name].commission += cp*qty;
    });
  });
  return Object.keys(totals).map(name=>({name, ...totals[name]}));
}

// ---- Calcula o total de comissões de todas as vendas ----
function computeGrandTotalCommission(){
  let total = 0;
  data.forEach(a=>{
    const cp = commissionPerUnit(a);
    a.clients.forEach(c=>{
      if(c.cancelled) return;
      const qty = c.qty || 1;
      total += cp*qty;
    });
  });
  return total;
}

// ---- Guarda a lista atualmente renderizada, para ligar os botões PDF ----
let currentClientsList = [];

// ---- Render vista por clienta (com filtro de busca) ----
function renderClientView(){
  const allClients = computeClientTotals();
  allClients.sort((a,b)=> b.total - a.total);

  const summaryEl = document.getElementById('commissionSummary');
  if(summaryEl){
    summaryEl.textContent = `Total comissões (todas as vendas): ${fmt(computeGrandTotalCommission())}€`;
  }

  const searchInput = document.getElementById('clientSearch');
  const query = searchInput ? searchInput.value.trim().toLowerCase() : '';

  const clients = query
    ? allClients.filter(c=> c.name.toLowerCase().includes(query))
    : allClients;

  currentClientsList = clients;

  const countEl = document.getElementById('clientSearchCount');
  if(query){
    countEl.textContent = `${clients.length} clienta(s) encontrada(s)`;
  } else {
    countEl.textContent = '';
  }

  const el = document.getElementById('clientResults');
  let html = '';
  if(clients.length === 0){
    html = `<p class="empty">Nenhuma clienta encontrada</p>`;
  } else {
    clients.forEach((c,idx)=>{
      html += `<div class="client-block"><div class="client-name">${idx+1}. ${c.name}</div><ul>`;
      c.items.forEach(it=>{
        const qtyLabel = it.qty > 1 ? ` x${it.qty}` : '';
        const detailLabel = it.detail ? ` — ${it.detail}` : '';
        html += `<li><span class="article-num">${it.num}</span> — ${it.title}${detailLabel}${qtyLabel} <span class="price">(${fmt(it.lineTotal)}€)</span></li>`;
      });
      html += `</ul>`;
      html += `<div class="client-total">Total artigos: ${fmt(c.total)}€</div>`;
      html += `<div class="grand-total">Total com Portes de ${fmt(PORTES_1)}€: ${fmt(c.total + PORTES_1)}€</div>`;
      html += `<div class="grand-total">Total com Portes de ${fmt(PORTES_2)}€: ${fmt(c.total + PORTES_2)}€</div>`;
      html += `<div class="comm-line">Total comissão: ${fmt(c.commission)}€</div>`;
      html += `<div class="pdf-buttons">
        <button class="pdf-btn" data-idx="${idx}" data-portes="1">PDF 5,40</button>
        <button class="pdf-btn" data-idx="${idx}" data-portes="2">PDF 8,93</button>
      </div>`;
      html += `</div>`;
    });
  }
  el.innerHTML = html;

  // Liga os botões de PDF (evita problemas de escaping de nomes com onclick inline)
  el.querySelectorAll('.pdf-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const portesValue = btn.dataset.portes === '1' ? PORTES_1 : PORTES_2;
      generateInvoicePDF(currentClientsList[idx], portesValue);
    });
  });
}

// ---- Gera a fatura em PDF (A4 vertical, 210mm x 297mm) ----
function generateInvoicePDF(client, portesValue){
  if(!client){ return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pageWidth = 210;
  const margin = 18;
  let y = 24;

  // Cabeçalho
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.text('FATURA', margin, y);

  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  const today = new Date();
  const dateStr = today.toLocaleDateString('pt-PT');
  doc.text(`Data de emissão: ${dateStr}`, pageWidth - margin, y - 6, {align:'right'});
  doc.text(`Ref.: ${Date.now().toString().slice(-6)}`, pageWidth - margin, y, {align:'right'});

  y += 5;
  doc.setDrawColor(0);
  doc.setLineWidth(0.7);
  doc.line(margin, y, pageWidth - margin, y);
  y += 10;

  // Bloco vendedora
  doc.setFontSize(10);
  doc.setFont('helvetica','bold');
  doc.text('VENDEDORA', margin, y);
  y += 5.5;
  doc.setFont('helvetica','normal');
  doc.text(SELLER_NAME, margin, y);
  y += 5;
  doc.text(`Titular: ${SELLER_TITULAR}`, margin, y);
  y += 5;
  doc.text(`${SELLER_BANK} — IBAN: ${SELLER_IBAN}`, margin, y);

  // Bloco cliente (alinhado à direita)
  let yClient = y - 15.5;
  doc.setFont('helvetica','bold');
  doc.text('CLIENTE', pageWidth - margin, yClient, {align:'right'});
  yClient += 5.5;
  doc.setFont('helvetica','normal');
  doc.text(client.name, pageWidth - margin, yClient, {align:'right'});

  y += 12;
  doc.setDrawColor(0);
  doc.setLineWidth(0.3);
  doc.line(margin, y, pageWidth - margin, y);
  y += 8;

  // Tabela de artigos
  const rows = client.items.map(it=>{
    const detail = it.detail ? it.detail : '-';
    const qty = it.qty || 1;
    return [
      String(it.num),
      it.title,
      detail,
      String(qty),
      `${fmt(it.unitPrice)}€`,
      `${fmt(it.lineTotal)}€`
    ];
  });

  doc.autoTable({
    startY: y,
    head: [['Nº','Artigo','Detalhe','Qtd','Preço Unit.','Total']],
    body: rows,
    margin: {left: margin, right: margin},
    styles: { font:'helvetica', fontSize:9, cellPadding:2.3, textColor:[0,0,0], lineColor:[0,0,0], lineWidth:0.1 },
    headStyles: { fillColor:[0,0,0], textColor:[255,255,255], fontStyle:'bold' },
    alternateRowStyles: { fillColor:[245,245,245] },
    columnStyles: {
      0: {cellWidth: 14},
      3: {cellWidth: 14, halign:'center'},
      4: {cellWidth: 26, halign:'right'},
      5: {cellWidth: 26, halign:'right'}
    }
  });

  let finalY = doc.lastAutoTable.finalY + 10;

  // Bloco de totais (sem comissão)
  const boxWidth = 85;
  const boxX = pageWidth - margin - boxWidth;

  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.text('Subtotal artigos:', boxX, finalY);
  doc.text(`${fmt(client.total)}€`, pageWidth - margin, finalY, {align:'right'});
  finalY += 6.5;

  doc.text('Portes de envio:', boxX, finalY);
  doc.text(`${fmt(portesValue)}€`, pageWidth - margin, finalY, {align:'right'});
  finalY += 4;
  doc.setLineWidth(0.4);
  doc.line(boxX, finalY, pageWidth - margin, finalY);
  finalY += 6.5;

  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text('TOTAL A PAGAR:', boxX, finalY);
  doc.text(`${fmt(client.total + portesValue)}€`, pageWidth - margin, finalY, {align:'right'});

  finalY += 16;
  doc.setFont('helvetica','italic');
  doc.setFontSize(9);
  doc.text('Obrigada pela sua encomenda!', margin, finalY);

  // Rodapé
  doc.setDrawColor(0);
  doc.setLineWidth(0.3);
  doc.line(margin, 278, pageWidth - margin, 278);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.text('Pagamento por transferência bancária para o IBAN indicado acima.', margin, 283);
  doc.text(`${SELLER_NAME} · ${SELLER_BANK} · Titular: ${SELLER_TITULAR} · ${SELLER_IBAN}`, margin, 288);

  const safeName = client.name.replace(/[^a-zA-Z0-9]+/g,'_');
  const portesTag = fmt(portesValue).replace(',', '_');
  doc.save(`Fatura_${safeName}_Portes_${portesTag}.pdf`);
}

// ---- Gera as faturas em PDF de todas as clientas de uma só vez ----
function printAllInvoices(portesValue){
  const allClients = computeClientTotals();
  if(allClients.length === 0){ return; }
  allClients.forEach((client, i)=>{
    setTimeout(()=>{
      generateInvoicePDF(client, portesValue);
    }, i * 450);
  });
}

  const articleView = document.getElementById('articleView');
  const clientView = document.getElementById('clientView');
  const btnArticle = document.getElementById('btnArticle');
  const btnClient = document.getElementById('btnClient');
  if(view==='article'){
    articleView.classList.remove('hidden');
    clientView.classList.add('hidden');
    btnArticle.classList.add('active');
    btnClient.classList.remove('active');
  } else {
    articleView.classList.add('hidden');
    clientView.classList.remove('hidden');
    btnArticle.classList.remove('active');
    btnClient.classList.add('active');
  }
}

renderArticleView();
renderClientView();
</script>
