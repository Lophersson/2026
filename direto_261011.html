<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DIRETO Domingo 11 Outubro 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Mono:wght@500;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--dim:#555;--red:#c62b32;--name:clamp(20px,6vw,34px);--num:clamp(120px,42vh,280px);--price:clamp(36px,9vh,62px);--bk:clamp(13px,3.2vh,20px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fff;color:var(--ink);font-family:'DM Sans',sans-serif;height:100dvh;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));overflow:hidden}
.stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
header{width:100%;position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:8px;padding-top:20px}
.clock{position:absolute;top:0;right:0;text-align:right;font:10px/1.3 'DM Mono',monospace;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.clock .time{color:var(--ink);font-size:12px;font-weight:700}
.title-row{display:flex;align-items:center;gap:8px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px 2px rgba(198,43,50,.5);animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
h1{font:700 clamp(24px,7vw,36px) 'Cormorant Garamond',serif;letter-spacing:.1em;margin:0;animation:b 1.6s ease-in-out infinite}
@keyframes b{0%,45%,100%{opacity:1}50%,90%{opacity:.22}}
.subline{font:clamp(10px,3vw,13px) 'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-top:2px;text-align:center}
main{width:100%;flex:1;min-height:0;display:flex}
.ficha{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"name" "num" "price"}
.name-block{grid-area:name;text-align:center;padding:12px 8px}
.art-name{font:700 var(--name)/1.2 'Cormorant Garamond',serif}
.num-block{grid-area:num;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.num{font:700 var(--num)/.8 'DM Mono',monospace;letter-spacing:-.05em}
.price-block{grid-area:price;text-align:center;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.breakdown{font:500 var(--bk)/1.1 'DM Mono',monospace;color:var(--dim)}
.price{font:700 var(--price)/1 'DM Mono',monospace}
@media(min-width:900px){
:root{--name:clamp(24px,4vw,60px);--num:clamp(180px,50vh,500px);--price:clamp(70px,17vh,160px);--bk:clamp(18px,3vh,32px)}
body{padding:24px}
.ficha{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"name name" "num price"}
.name-block{text-align:left;padding:22px 48px}
.num-block{justify-content:flex-start;padding-left:56px}
.price-block{justify-content:center;align-items:flex-end;text-align:right;padding:0 56px}}
.controls{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px;width:100%;opacity:.3;transition:opacity .2s}
.controls:hover,.controls:focus-within,.controls:active{opacity:1}
.nav{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
.arrow-btn{width:54px;height:54px;border-radius:12px;border:3px solid #000;background:transparent;font-size:22px;cursor:pointer;touch-action:manipulation}
.arrow-btn:active{transform:scale(.9);background:rgba(0,0,0,.08)}
.arrow-btn:disabled{opacity:.25}
.position{font:18px 'DM Mono',monospace;color:var(--dim);min-width:70px;text-align:center}
.position b{color:#000;font-size:22px}
.bottom-row{display:flex;justify-content:center;gap:12px;width:100%}
.jump{display:flex;align-items:center;gap:6px}
.jump input{width:55px;height:40px;border:3px solid #000;font:16px 'DM Mono',monospace;text-align:center;border-radius:8px}
.jump button{background:#000;border:3px solid #000;color:#fff;font:700 13px 'DM Sans',sans-serif;padding:0 12px;border-radius:8px;height:40px}
.mirror-btn{width:40px;height:40px;border-radius:8px;border:3px solid #000;background:transparent;font-size:16px}
body.mirrored .stage{transform:scaleX(-1)}
body.mirrored .controls{transform:scaleX(-1)}
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="clock"><span id="clock-date"></span><br><span class="time" id="clock-time"></span></div>
    <div class="title-row"><div class="live-dot"></div><h1>DIRETO</h1></div>
    <div class="subline" id="subline"></div>
  </header>
  <main>
    <div class="ficha">
      <div class="name-block"><span class="art-name"></span></div>
      <div class="num-block"><span class="num"></span></div>
      <div class="price-block"><span class="breakdown"></span><span class="price"></span></div>
    </div>
  </main>
  <div class="controls">
    <div class="nav">
      <button class="arrow-btn" id="prev-btn" aria-label="Artigo anterior">←</button>
      <div class="position"><b id="current-idx"></b>/<span id="total-idx"></span></div>
      <button class="arrow-btn" id="next-btn" aria-label="Artigo seguinte">→</button>
    </div>
    <div class="bottom-row">
      <div class="jump"><input type="number" id="jump-input" placeholder="N.º" aria-label="Número do artigo"><button id="jump-btn">IR</button></div>
      <button class="mirror-btn" id="mirror-toggle" aria-label="Espelhar ecrã">⇄</button>
    </div>
  </div>
</div>
<script>
// Altere "preco" (preço de loja) e "comissao" para cada artigo.
const items = [
  { name: "Conjunto de bebé branco com cactos e cowboys (24-36 meses)", un: 1, preco: 0, comissao: 0 },
  { name: "Pijamas Disney Baby Winnie the Pooh, pack de 2", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola preta Unicorns Are Real com unicórnio de brilhantes", un: 1, preco: 0, comissao: 0 },
  { name: "Calções de camurça castanha com atacadores e rebites", un: 3, preco: 0, comissao: 0 },
  { name: "Collants cinzentos Primark, pack de 3", un: 3, preco: 0, comissao: 0 },
  { name: "Conjunto de oferta de banho Windsor (baunilha)", un: 1, preco: 0, comissao: 0 },
  { name: "Esponjas de cozinha Stella, 5 peças — latte de baunilha", un: 5, preco: 0, comissao: 0 },
  { name: "Collants pretos Primark, pack de 3", un: 1, preco: 0, comissao: 0 },
  { name: "Eau de Parfum Disney Princess — Cinderela (caixa rosa)", un: 1, preco: 0, comissao: 0 },
  { name: "Eau de Parfum Disney Princess — Ariel (caixa turquesa)", un: 1, preco: 0, comissao: 0 },
  { name: "Eau de Parfum Disney Princess — Jasmine (caixa lilás)", un: 1, preco: 0, comissao: 0 },
  { name: "Eau de Parfum Disney Princess — Bela (caixa amarela)", un: 1, preco: 0, comissao: 0 },
  { name: "Calças de bombazina azul-marinho", un: 1, preco: 0, comissao: 0 },
  { name: "Malha bege com riscas castanhas e vermelhas", un: 1, preco: 0, comissao: 0 },
  { name: "Meias Disney Classics (Bambi)", un: 1, preco: 0, comissao: 0 },
  { name: "Meias Mickey and Friends (Minnie)", un: 1, preco: 0, comissao: 0 },
  { name: "Meias curtas Primark, pack de 5 (morangos)", un: 1, preco: 0, comissao: 0 },
  { name: "Sapatos Melissa dourados com laço", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola cinzenta do Stitch", un: 1, preco: 0, comissao: 0 },
  { name: "Cuecas Primark, pack de 10 (caveiras e camuflado)", un: 1, preco: 0, comissao: 0 },
  { name: "Creme corporal Sweet Soufflé (boião laranja)", un: 3, preco: 0, comissao: 0 },
  { name: "Relógio infantil MyTime — Cars (azul)", un: 1, preco: 0, comissao: 0 },
  { name: "Relógio infantil MyTime — spinner cor-de-rosa com ursinho", un: 1, preco: 0, comissao: 0 },
  { name: "Babetes Soft Touch Primark Baby, pack de 2 (urso)", un: 1, preco: 0, comissao: 0 },
  { name: "Carrinho vermelho decorativo de Natal com vitrine", un: 1, preco: 0, comissao: 0 },
  { name: "Comboio decorativo preto com vitrine de Natal", un: 1, preco: 0, comissao: 0 },
  { name: "Pijama cor-de-rosa com padrão nórdico", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola preta lisa", un: 1, preco: 0, comissao: 0 },
  { name: "Calças de ganga azul-claro", un: 1, preco: 0, comissao: 0 },
  { name: "Camisa xadrez preta e branca", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola de malha azul-claro com remates azul-marinho e vermelho", un: 1, preco: 0, comissao: 0 },
  { name: "Pijama Bluey azul-marinho com estrelas e luas", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola vermelha do Super Mario", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola cor-de-rosa felpuda com estrela de brilhantes", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola cinzenta com letras cor-de-rosa felpudas", un: 1, preco: 0, comissao: 0 },
  { name: "Pijama de Natal com bolachas de gengibre e bengalas doces", un: 1, preco: 0, comissao: 0 },
  { name: "Pantufas felpudas de Natal (Pai Natal)", un: 1, preco: 0, comissao: 0 },
  { name: "Calças vermelhas", un: 3, preco: 0, comissao: 0 },
  { name: "Camisola vermelha da Minnie — Merry Christmas", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola cinzenta clara com rena de Natal", un: 1, preco: 0, comissao: 0 },
  { name: "Vestido vermelho Chip e Dale — Happy Holiday (com tule)", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola cor-de-rosa com pinguim — I Love Christmas", un: 1, preco: 0, comissao: 0 },
  { name: "Conjunto de malha bege com pintas e renas", un: 1, preco: 0, comissao: 0 },
  { name: "Leggings de ganga azul-escuro com risca lateral", un: 1, preco: 0, comissao: 0 },
  { name: "Calças verde-escuras Zara", un: 1, preco: 0, comissao: 0 },
  { name: "Calças pretas com risca cor-de-rosa brilhante", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola com bandeira do Reino Unido", un: 2, preco: 0, comissao: 0 },
  { name: "Camisola cinzenta PARIS com brilhantes", un: 1, preco: 0, comissao: 0 },
  { name: "Gola de malha cinzenta canelada", un: 1, preco: 0, comissao: 0 },
  { name: "Pijama H&M verde-água com pintas", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola de Natal Snoopy (branca e vermelha)", un: 3, preco: 0, comissao: 0 },
  { name: "Pijama Snoopy cinzento às riscas", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola de Natal vermelha da Minnie com padrão nórdico", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola preta da Patrulha Pata (Skye)", un: 1, preco: 0, comissao: 0 },
  { name: "Pijama cor-de-rosa com bengalas doces", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola de Natal azul-marinho e vermelha com flocos de neve", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola de Natal verde do Grinch", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola de Natal azul-marinho com pinguim e pompons", un: 1, preco: 0, comissao: 0 },
  { name: "Camisola branca felpuda com apliqué vermelho", un: 1, preco: 0, comissao: 0 }
];
const START_NUM = 30;
const END_NUM = START_NUM + items.length - 1;
let i = 0;
const $ = s => document.querySelector(s);
const euro = v => Number(v).toFixed(2).replace('.', ',') + '€';
const prev = $('#prev-btn'), next = $('#next-btn'), jump = $('#jump-input');
jump.min = START_NUM; jump.max = END_NUM;

function render(){
  const it = items[i], n = i + START_NUM;
  $('.art-name').textContent = it.un > 1 ? it.name + ' — ' + it.un + ' un.' : it.name;
  $('.num').textContent = n;
  $('.breakdown').textContent = euro(it.preco) + ' + ' + euro(it.comissao);
  $('.price').textContent = euro(it.preco + it.comissao);
  $('#current-idx').textContent = n;
  $('#total-idx').textContent = END_NUM;
  prev.disabled = i === 0;
  next.disabled = i === items.length - 1;
}
prev.onclick = () => { if(i > 0){ i--; render(); } };
next.onclick = () => { if(i < items.length - 1){ i++; render(); } };
$('#jump-btn').onclick = () => {
  const k = parseInt(jump.value, 10) - START_NUM;
  if(Number.isInteger(k) && k >= 0 && k < items.length){ i = k; render(); }
};
jump.addEventListener('keydown', e => { if(e.key === 'Enter') $('#jump-btn').click(); });
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') next.click();
  if(e.key === 'ArrowLeft') prev.click();
});
$('#mirror-toggle').onclick = () => document.body.classList.toggle('mirrored');

function clock(){
  const d = new Date();
  const m = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  const w = ["DOMINGO","SEGUNDA-FEIRA","TERÇA-FEIRA","QUARTA-FEIRA","QUINTA-FEIRA","SEXTA-FEIRA","SÁBADO"];
  const mf = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
  $('#clock-date').textContent = d.getDate() + ' ' + m[d.getMonth()];
  $('#clock-time').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  $('#subline').textContent = w[d.getDay()] + ' ' + d.getDate() + ' ' + mf[d.getMonth()] + ' ' + d.getFullYear();
}
clock(); setInterval(clock, 30000);
render();
</script>
</body>
</html>
