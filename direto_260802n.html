<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIRETO — 2 Agosto 2026</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#ffffff;
    --panel:#ffffff;
    --gold:#000000;
    --gold-dim:#333333;
    --ink:#000000;
    --ink-dim:#555555;
    --red:#c62b32;
    --line:#000000;
    --card-bg:#ffffff;
    --card-ink:#000000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:14px 16px;
    overflow:hidden;
  }

  .stage{
    width:100%;
    max-width:99vw;
    height:100%;
    max-height:98vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* ---- HEADER ---- */
  header{
    width:100%;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
    margin-bottom:clamp(6px, 1.8vh, 16px);
  }
  .clock{
    position:absolute;
    top:0;
    right:0;
    text-align:right;
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    line-height:1.5;
    text-transform:uppercase;
  }
  .clock .time{
    color:var(--ink);
    font-size:13px;
    font-weight:700;
  }
  .title-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .live-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px 2px rgba(198,43,50,0.5);
    animation:dotpulse 1.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes dotpulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.35; transform:scale(0.8);}
  }
  h1.directo{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(30px, 4.6vh, 54px);
    letter-spacing:0.14em;
    margin:0;
    color:var(--ink);
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,45%,100%{opacity:1;}
    50%,90%{opacity:0.22;}
  }
  .subline{
    font-family:'DM Mono', monospace;
    font-size:20px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:2px;
  }

  /* ---- FICHA ---- */
  main{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .ficha-wrap{
    width:100%;
    max-width:none;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:stretch;
  }

  table.ficha{
    width:100%;
    border-collapse:collapse;
    border:5px solid var(--line);
    table-layout:fixed;
    background:var(--card-bg);
    color:var(--card-ink);
  }
  table.ficha td{
    border:5px solid var(--line);
    padding:0;
  }
  .num-cell{
    width:34%;
    text-align:center;
    vertical-align:middle;
    padding:5px;
  }
  .num-cell .num{
    font-family:'DM Mono', monospace;
    font-weight:700;
    font-size:clamp(400px, 15vh, 150px);
    line-height:1;
    color:var(--card-ink);
    letter-spacing:-0.02em;
  }
  .name-cell{
    text-align:center;
    vertical-align:middle;
    padding:clamp(10px, 2vh, 22px) 20px;
  }
  .name-cell .art-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(60px, 5.6vh, 52px);
    line-height:1.15;
    outline:none;
    display:block;
  }
  .price-cell{
    text-align:center;
    vertical-align:middle;
    padding:clamp(8px, 1.6vh, 16px) 20px;
    font-family:'DM Mono', monospace;
  }
  .price-cell .row{
    display:flex;
    justify-content:space-between;
    font-size:clamp(60px, 2vh, 18px);
    padding:clamp(2px, 0.6vh, 6px) 6px;
    color:#000000;
  }
  .price-cell .row span:last-child{
    outline:none;
    min-width:70px;
    text-align:right;
  }
  .price-cell .row.total{
    margin-top:clamp(4px, 0.8vh, 8px);
    padding-top:clamp(6px, 1vh, 10px);
    border-top:2px solid var(--card-ink);
    font-weight:700;
    font-size:clamp(60px, 2.4vh, 22px);
    color:var(--card-ink);
  }

  [contenteditable="true"]:focus{
    background:rgba(0,0,0,0.06);
  }

  /* ---- NAV ---- */
  .nav{
    display:flex;
    align-items:center;
    gap:22px;
    flex:0 0 auto;
    margin-top:clamp(8px, 1.6vh, 16px);
  }
  .arrow-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:2px solid #000000;
    background:transparent;
    color:#000000;
    font-size:17px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.18s, transform 0.12s;
  }
  .arrow-btn:hover{
    background:rgba(0,0,0,0.08);
  }
  .arrow-btn:active{
    transform:scale(0.92);
  }
  .arrow-btn:disabled{
    opacity:0.25;
    cursor:default;
  }
  .arrow-btn:disabled:hover{
    background:transparent;
  }
  .position{
    font-family:'DM Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    min-width:70px;
    text-align:center;
  }
  .position b{
    color:#000000;
  }

  .jump{
    margin-top:clamp(6px, 1vh, 10px);
    font-family:'DM Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .jump input{
    width:64px;
    background:#ffffff;
    border:1px solid #000000;
    color:#000000;
    font-family:'DM Mono', monospace;
    font-size:12px;
    padding:4px 8px;
    text-align:center;
    border-radius:2px;
  }
  .jump button{
    background:transparent;
    border:1px solid #000000;
    color:#000000;
    font-family:'DM Sans', sans-serif;
    font-size:11px;
    padding:4px 10px;
    border-radius:2px;
    cursor:pointer;
  }
  .jump button:hover{
    background:rgba(0,0,0,0.06);
  }

  /* ---- MOBILE (ex: Samsung S24 y similares) ---- */
  @media (max-width: 480px){
    body{
      padding:8px 10px;
    }
    .clock{
      font-size:9px;
    }
    .clock .time{
      font-size:11px;
    }
    h1.directo{
      font-size:clamp(20px, 6vw, 30px);
    }
    .subline{
      font-size:12px;
      letter-spacing:0.2em;
    }
    table.ficha{
      border-width:3px;
    }
    table.ficha td{
      border-width:3px;
    }
    .num-cell .num{
      font-size:clamp(70px, 22vw, 110px);
    }
    .name-cell{
      padding:10px 10px;
    }
    .name-cell .art-name{
      font-size:clamp(22px, 6.5vw, 30px);
    }
    .price-cell{
      padding:8px 10px;
    }
    .price-cell .row{
      font-size:clamp(14px, 4vw, 17px);
      padding:3px 4px;
    }
    .price-cell .row.total{
      font-size:clamp(16px, 4.6vw, 20px);
    }
    .arrow-btn{
      width:36px;
      height:36px;
      font-size:15px;
    }
    .position{
      font-size:11px;
      min-width:60px;
    }
    .jump{
      font-size:10px;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <div class="clock">
      <div class="date" id="dateOut">—</div>
      <div class="time" id="timeOut">—</div>
    </div>
    <div class="title-row">
      <span class="live-dot"></span>
      <h1 class="directo">DIRETO</h1>
    </div>
    <div class="subline">Emissão em curso</div>
  </header>

  <main>
    <div class="ficha-wrap">
      <table class="ficha">
        <tr>
          <td class="num-cell" rowspan="2"><span class="num" id="numOut">30</span></td>
          <td class="name-cell"><span class="art-name" contenteditable="true" id="nameOut">Nome do artigo</span></td>
        </tr>
        <tr>
          <td class="price-cell">
            <div class="row"><span>Preço</span><span contenteditable="true" id="priceOut">0,00 €</span></div>
            <div class="row"><span>Comissão</span><span contenteditable="true" id="commOut">0,00 €</span></div>
            <div class="row total"><span>Total a pagar</span><span id="totalOut">0,00 €</span></div>
          </td>
        </tr>
      </table>
    </div>

    <div class="nav">
      <button class="arrow-btn" id="prevBtn" aria-label="Ficha anterior">←</button>
      <div class="position"><b id="posOut">1</b> / <span id="countOut">21</span></div>
      <button class="arrow-btn" id="nextBtn" aria-label="Ficha seguinte">→</button>
    </div>

    <div class="jump">
      <span>Ir ao nº</span>
      <input type="number" id="jumpInput" min="30" max="100" value="30">
      <button id="jumpBtn">Ir</button>
    </div>
  </main>
</div>

<script>
  // ---- Relógio em direto ----
  const dateOut = document.getElementById('dateOut');
  const timeOut = document.getElementById('timeOut');
  function tickClock(){
    const now = new Date();
    dateOut.textContent = now.toLocaleDateString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric' });
    timeOut.textContent = now.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---- Dados das fichas (30 → 50) ----
  // O nome pode conter <br> para forçar um salto de linha (usa-se innerHTML, não textContent)
  const datos = {
    30: { name:'sapatilhas macias Hogwarts<br>35/38', price:1.40, comm:1.00 },
    31: { name:'sapatilhas macias Minnie<br>26.5/30.5 - 3/6 anos', price:2.00, comm:1.50 },
    32: { name:'vestido branco<br>18/24', price:3.00, comm:2.00 },
    33: { name:'crocs brancos tratores<br>27, 29, 30/31', price:5.00, comm:2.00 },
    34: { name:'shaper legging preto<br>XS', price:3.00, comm:2.00 },
    35: { name:'pacote x5 camisolas sem mangas<br>12/13 anos', price:3.00, comm:2.00 },
    36: { name:'conjunto azul baleia<br>18/24 x4', price:3.00, comm:2.00 },
    37: { name:'babadores set x2 animais castanho e branco', price:2.00, comm:1.50 },
    38: { name:'calçoes castanhos atacadores e tachas<br>40 e 42', price:3.00, comm:2.00 },
    39: { name:'meias minnie set x4.<br>3/6 x2 e 7/10', price:3.00, comm:2.00 },
    40: { name:'sueter azul yale<br>L', price:7.00, comm:2.00 },
    41: { name:'calças jogger cinzento<br>XS', price:7.00, comm:2.00 },
    42: { name:'calçoes ganga barbie<br>40', price:5.00, comm:2.00 },
    43: { name:'pijama cinzento escuro bratz<br>2XS', price:5.00, comm:2.00 },
    44: { name:'crocs cinzentos escuros play station<br>28 x2, 29 x2', price:5.00, comm:2.00 },
    45: { name:'conjunto k-pop huntrix<br>11/12 x2, 12/13 x2, 13/14 x2', price:6.00, comm:2.00 },
    46: { name:'colete preto menina<br>7/8', price:5.00, comm:2.00 },
    47: { name:'calças de ganga urso x2<br>12/18', price:7.00, comm:2.00 },
    48: { name:'pijama dinossauros verde x4<br>3/4', price:5.00, comm:2.00 },
    49: { name:'conjunto blusa y saia menina x2<br>los angeles 1994 12 y 14 anos', price:5.99, comm:2.00 },
    50: { name:'crema de maos rosa x3', price:1.20, comm:1.00 },
    51: { name:'crema de maos branco x2', price:1.20, comm:1.00 },
    52: { name:'palhas stitch set x4', price:2.00, comm:1.50 },
    53: { name:'capa telemovil stitch x2<br>iphone 13/14/15 e 15 pro', price:3.00, comm:2.00 },
    54: { name:'capa telemovel hello kitty<br>iphone 15 pro', price:3.00, comm:2.00 },
    55: { name:'pistachio muffins', price:2.20, comm:1.50 },
    56: { name:'brownie y cookie', price:2.20, comm:1.50 },
    57: { name:'decoração de bolos x3', price:1.49, comm:1.00 },
    58: { name:'creme de corpo x3', price:2.00, comm:1.50 },
    59: { name:'canetas disney x2', price:2.00, comm:1.50 },
    60: { name:'elasticos cabelo pretos y cinzas x2', price:1.00, comm:1.00 },
    61: { name:'toca de cetim azul', price:1.00, comm:1.00 },
    62: { name:'fita margarida', price:2.00, comm:1.50 },
    63: { name:'elasticos de cetim cores', price:1.00, comm:1.00 },
    64: { name:'bloco de gabbi dollhouse', price:2.00, comm:1.50 },
    65: { name:'pijama monsters, inc. pixar aqua x2<br>2XL e XL', price:4.00, comm:2.00 },
    66: { name:'meias menina morangos x11<br>2/3 x3, 3/6 x3, 7/10 x3, 11+ x2', price:1.00, comm:1.00 },
    67: { name:'meias bambi set x4<br>3/6 x3, 7/10 x3', price:2.00, comm:1.50 },
    68: { name:'meias cores flores set x5<br>3/6 x3, 11+ x3', price:1.00, comm:1.00 },
    69: { name:'meias stitch set 7 x4<br>2/3, 7/10, 11+ x2', price:2.00, comm:1.50 },
    70: { name:'camisola menina sem mangas set x5<br>6/7, 7/8 x2', price:2.00, comm:1.50 },
    71: { name:'calças azul bluey<br>2/3', price:2.00, comm:1.50 },
  };

  // ---- Constrói a lista de fichas a partir de "datos" ----
  const fichas = Object.keys(datos)
    .map(Number)
    .sort((a, b) => a - b)
    .map(num => ({ num, name: datos[num].name, price: datos[num].price, comm: datos[num].comm }));

  let idx = 0;

  const numOut = document.getElementById('numOut');
  const nameOut = document.getElementById('nameOut');
  const priceOut = document.getElementById('priceOut');
  const commOut = document.getElementById('commOut');
  const totalOut = document.getElementById('totalOut');
  const posOut = document.getElementById('posOut');
  const countOut = document.getElementById('countOut');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const jumpInput = document.getElementById('jumpInput');
  const jumpBtn = document.getElementById('jumpBtn');

  countOut.textContent = fichas.length;

  function parseMoney(str){
    const clean = str.replace(/[^\d,.-]/g,'').replace(',', '.');
    const val = parseFloat(clean);
    return isNaN(val) ? 0 : val;
  }
  function fmtMoney(val){
    return val.toLocaleString('pt-PT', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
  }

  function saveCurrentEdits(){
    const f = fichas[idx];
    // guarda o HTML editado (preserva <br> se o utilizador tiver quebrado a linha)
    const html = nameOut.innerHTML.trim();
    f.name = html || 'Nome do artigo';
    f.price = parseMoney(priceOut.textContent);
    f.comm = parseMoney(commOut.textContent);
  }

  function render(){
    const f = fichas[idx];
    numOut.textContent = f.num;
    nameOut.innerHTML = f.name;       // innerHTML para respeitar os <br>
    priceOut.textContent = fmtMoney(f.price);
    commOut.textContent = fmtMoney(f.comm);
    totalOut.textContent = fmtMoney(f.price + f.comm);
    posOut.textContent = idx + 1;
    jumpInput.value = f.num;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === fichas.length - 1;
  }

  function goTo(newIdx){
    saveCurrentEdits();
    idx = Math.max(0, Math.min(fichas.length - 1, newIdx));
    render();
  }

  prevBtn.addEventListener('click', () => goTo(idx - 1));
  nextBtn.addEventListener('click', () => goTo(idx + 1));

  jumpBtn.addEventListener('click', () => {
    const target = parseInt(jumpInput.value, 10);
    if(!isNaN(target)){
      const found = fichas.findIndex(f => f.num === target);
      if(found !== -1) goTo(found);
    }
  });

  // recalcula o total em tempo real ao editar preço/comissão
  [priceOut, commOut].forEach(el => {
    el.addEventListener('input', () => {
      const p = parseMoney(priceOut.textContent);
      const c = parseMoney(commOut.textContent);
      totalOut.textContent = fmtMoney(p + c);
    });
  });

  // permite inserir <br> real no nome com Enter (em vez de <div>)
  nameOut.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      document.execCommand('insertLineBreak');
    }
  });

  document.addEventListener('keydown', (e) => {
    if(document.activeElement === nameOut || document.activeElement === priceOut || document.activeElement === commOut) return;
    if(e.key === 'ArrowLeft') goTo(idx - 1);
    if(e.key === 'ArrowRight') goTo(idx + 1);
  });

  // ---- Navegação por swipe (toque) ----
  let touchStartX = 0;
  let touchStartY = 0;
  const SWIPE_THRESHOLD = 40; // px mínimos para contar como swipe

  document.addEventListener('touchstart', (e) => {
    if(document.activeElement === nameOut || document.activeElement === priceOut || document.activeElement === commOut) return;
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive:true });

  document.addEventListener('touchend', (e) => {
    if(document.activeElement === nameOut || document.activeElement === priceOut || document.activeElement === commOut) return;
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;
    // só reage se o movimento horizontal for maior que o vertical (evita conflito com scroll)
    if(Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD){
      if(diffX < 0){
        goTo(idx + 1); // swipe para a esquerda → seguinte
      } else {
        goTo(idx - 1); // swipe para a direita → anterior
      }
    }
  }, { passive:true });

  render();
</script>
</body>
</html>
