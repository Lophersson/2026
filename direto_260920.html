<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIRETO - DOMINGO 20 SETEMBRO 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Mono:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#ffffff;
    --panel:#ffffff;
    --gold:#000000;
    --gold-dim:#333333;
    --ink:#000000;
    --ink-dim:#555555;
    --red:#c62b32;
    --line:#000000;
    --card-bg:#ffffff;
    --card-ink:#000000;

    --name-size: clamp(20px, 6vw, 34px);
    --num-size: clamp(120px, 42vh, 280px);
    --price-size: clamp(36px, 9vh, 62px);
    --breakdown-size: clamp(13px, 3.2vh, 20px);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
  }

  body{
    background:#ffffff;
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px;
    overflow:hidden;
  }

  .stage{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
  }

  header{
    width:100%;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
    margin-bottom:8px;
    padding-top:20px;
  }

  .clock{
    position:absolute;
    top:0;
    right:0;
    text-align:right;
    font-family:'DM Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    line-height:1.3;
    text-transform:uppercase;
  }

  .clock .time{
    color:var(--ink);
    font-size:12px;
    font-weight:700;
  }

  .title-row{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .live-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px 2px rgba(198,43,50,0.5);
    animation:dotpulse 1.4s ease-in-out infinite;
    flex-shrink:0;
  }

  @keyframes dotpulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.35;transform:scale(0.8);}
  }

  h1.directo{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(24px, 7vw, 36px);
    letter-spacing:0.1em;
    margin:0;
    color:var(--ink);
    animation:blink 1.6s ease-in-out infinite;
  }

  @keyframes blink{
    0%,45%,100%{opacity:1;}
    50%,90%{opacity:0.22;}
  }

  .subline{
    font-family:'DM Mono', monospace;
    font-size:clamp(10px, 3vw, 13px);
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:2px;
    text-align:center;
  }

  main{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    touch-action:pan-y;
  }

  .ficha-vertical{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:
      "name"
      "num"
      "price";
    border:0;
    background:var(--card-bg);
    color:var(--card-ink);
  }

  .name-block{
    grid-area:name;
    text-align:center;
    padding:12px 8px;
  }

  .name-block .art-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:var(--name-size);
    line-height:1.2;
    outline:none;
    display:block;
    color:#000000;
  }

  .num-block{
    grid-area:num;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    overflow:hidden;
  }

  .num-block .num{
    font-family:'DM Mono', monospace;
    font-weight:700;
    font-size:var(--num-size);
    line-height:0.8;
    color:#000000;
    letter-spacing:-0.05em;
  }

  .price-block{
    grid-area:price;
    text-align:center;
    padding:12px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }

  .price-block .breakdown{
    font-family:'DM Mono', monospace;
    font-weight:500;
    font-size:var(--breakdown-size);
    line-height:1.1;
    color:var(--ink-dim);
    letter-spacing:0.02em;
  }

  .price-block .price{
    font-family:'DM Mono', monospace;
    font-weight:700;
    font-size:var(--price-size);
    line-height:1;
    color:#000000;
    display:inline-block;
  }

  @media (min-width:900px){
    :root{
      --name-size:clamp(24px, 4.0vw, 60px);
      --num-size:clamp(180px, 50vh, 500px);
      --price-size:clamp(70px, 17vh, 160px);
      --breakdown-size:clamp(18px, 3vh, 32px);
    }

    body{padding:24px;}

    .ficha-vertical{
      grid-template-columns:1fr 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:
        "name name"
        "num price";
    }

    .name-block{
      text-align:left;
      padding:22px 48px;
    }

    .num-block{
      justify-content:flex-start;
      padding-left:56px;
    }

    .price-block{
      justify-content:center;
      align-items:flex-end;
      text-align:right;
      padding:0 56px;
    }
  }

  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
    margin-top:12px;
    width:100%;
    opacity:0.3;
    transition:opacity 0.2s ease;
  }

  .controls:hover,
  .controls:focus-within,
  .controls:active{
    opacity:1;
  }

  .nav{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:16px;
    width:100%;
  }

  .arrow-btn{
    width:54px;
    height:54px;
    border-radius:12px;
    border:3px solid #000000;
    background:transparent;
    color:#000000;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
  }

  .arrow-btn:active{
    transform:scale(0.9);
    background:rgba(0,0,0,0.08);
  }

  .arrow-btn:disabled{
    opacity:0.25;
  }

  .position{
    font-family:'DM Mono', monospace;
    font-size:18px;
    color:var(--ink-dim);
    min-width:60px;
    text-align:center;
  }

  .position b{
    color:#000000;
    font-size:22px;
  }

  .bottom-row{
    display:flex;
    flex-direction:row;
    justify-content:center;
    gap:12px;
    width:100%;
  }

  .jump{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:6px;
    font-family:'DM Mono', monospace;
    font-size:14px;
  }

  .jump input{
    width:55px;
    height:40px;
    background:#ffffff;
    border:3px solid #000000;
    color:#000000;
    font-family:'DM Mono', monospace;
    font-size:16px;
    text-align:center;
    border-radius:8px;
  }

  .jump button{
    background:#000000;
    border:3px solid #000000;
    color:#ffffff;
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:0 12px;
    border-radius:8px;
    height:40px;
    display:flex;
    align-items:center;
  }

  .mirror-btn{
    width:40px;
    height:40px;
    border-radius:8px;
    border:3px solid #000000;
    background:transparent;
    color:#000000;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
  }

  body.mirrored .stage{
    transform:scaleX(-1);
  }

  body.mirrored .controls{
    transform:scaleX(-1);
  }
</style>
</head>

<body>

<div class="stage">

  <header>
    <div class="clock">
      <span id="clock-date">20 SET</span><br>
      <span class="time" id="clock-time">18:00</span>
    </div>

    <div class="title-row">
      <div class="live-dot"></div>
      <h1 class="directo">DIRETO</h1>
    </div>

    <div class="subline">DOMINGO 20 SETEMBRO 2026</div>
  </header>

  <main>
    <div class="ficha-vertical">

      <div class="name-block">
        <span class="art-name">NOME DO ARTIGO</span>
      </div>

      <div class="num-block">
        <span class="num">30</span>
      </div>

      <div class="price-block">
        <span class="breakdown" id="breakdown">0,00€ + 1,00€</span>
        <span class="price">1,00€</span>
      </div>

    </div>
  </main>

  <div class="controls">

    <div class="nav">
      <button class="arrow-btn" id="prev-btn">←</button>

      <div class="position">
        <b id="current-idx">30</b>/<span id="total-idx">91</span>
      </div>

      <button class="arrow-btn" id="next-btn">→</button>
    </div>

    <div class="bottom-row">
      <div class="jump">
        <input type="number" id="jump-input" placeholder="Nº" min="30" max="91">
        <button id="jump-btn">IR</button>
      </div>

      <button class="mirror-btn" id="mirror-toggle">⇄</button>
    </div>

  </div>
</div>

<script>

  // 62 artigos sem repetições.
  // preco = preço inicial (0€) | comissao = comissão (1€; muda para 2, 3 ou 5 se precisares)
  // Total mostrado = preco + comissao
  const items = [
    { name: "camisa bordô com colarinho", preco: 0, comissao: 1 },
    { name: "t-shirt branca “Little Squirrel” com esquilo", preco: 0, comissao: 1 },
    { name: "camisola preta com colarinho", preco: 0, comissao: 1 },
    { name: "camisola de malha bege com padrão nórdico", preco: 0, comissao: 1 },
    { name: "t-shirt preta Garfield aos quadradinhos", preco: 0, comissao: 1 },
    { name: "t-shirt laranja lisa", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho com monstro e gorro", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho com círculo colorido", preco: 0, comissao: 1 },
    { name: "camisa azul-marinho", preco: 0, comissao: 1 },
    { name: "t-shirt mostarda com alce", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho “Spidey” Homem-Aranha", preco: 0, comissao: 1 },
    { name: "t-shirt vermelha Snoopy “Lunk!”", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta clara com estampado azul", preco: 0, comissao: 1 },
    { name: "sweatshirt bege “Hogwarts”", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta com dinossauros", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta escura “Rebel Boy”", preco: 0, comissao: 1 },
    { name: "t-shirt branca “NLX” Londres", preco: 0, comissao: 1 },
    { name: "camisa xadrez vermelha e roxa", preco: 0, comissao: 1 },
    { name: "t-shirt branca “Midtown Orgnl”", preco: 0, comissao: 1 },
    { name: "t-shirt branca e vermelha Mickey “Feeling Good”", preco: 0, comissao: 1 },
    { name: "t-shirt branca com robô “For”", preco: 0, comissao: 1 },
    { name: "t-shirt às riscas com botões", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta “Berlin” com círculo amarelo", preco: 0, comissao: 1 },
    { name: "t-shirt cáqui “Wanted”", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho “Here Comes” com árvore de Natal", preco: 0, comissao: 1 },
    { name: "t-shirt vermelha “Friends 4 Ever” com ursos", preco: 0, comissao: 1 },
    { name: "t-shirt preta Buzz Lightyear", preco: 0, comissao: 1 },
    { name: "camisa xadrez branca e azul", preco: 0, comissao: 1 },
    { name: "t-shirt mostarda e vermelha “Spread Awesome”", preco: 0, comissao: 1 },
    { name: "t-shirt preta “Star Wars”", preco: 0, comissao: 1 },
    { name: "t-shirt preta com bicicleta BMX", preco: 0, comissao: 1 },
    { name: "t-shirt verde-acinzentada “Lost in Nature”", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta escura camaleão “Always Go Exploring”", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho “Freedom to Roam”", preco: 0, comissao: 1 },
    { name: "camisola verde de losangos", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho com estampado branco", preco: 0, comissao: 1 },
    { name: "camisola cinzenta com dinossauro", preco: 0, comissao: 1 },
    { name: "camisa de flanela xadrez preta e branca", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta “Friends Forever” com raposa", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho e branca “Boston Station”", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho “Travelling Tour”", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho e vermelha", preco: 0, comissao: 1 },
    { name: "t-shirt azul-marinho “Big Wheels” com jipe", preco: 0, comissao: 1 },
    { name: "casaco de malha mostarda com fecho", preco: 0, comissao: 1 },
    { name: "camisa de flanela xadrez vermelha e preta", preco: 0, comissao: 1 },
    { name: "camisa branca", preco: 0, comissao: 1 },
    { name: "camisa xadrez azul-marinho e branca", preco: 0, comissao: 1 },
    { name: "t-shirt preta lisa", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta lisa", preco: 0, comissao: 1 },
    { name: "camisola azul-marinho lisa", preco: 0, comissao: 1 },
    { name: "t-shirt vermelha C&A", preco: 0, comissao: 1 },
    { name: "peça azul-escura lisa", preco: 0, comissao: 1 },
    { name: "peça preta lisa", preco: 0, comissao: 1 },
    { name: "camisa azul-clara com bolso “Wow”", preco: 0, comissao: 1 },
    { name: "camisa azul com estampado de gorros de Natal", preco: 0, comissao: 1 },
    { name: "camisa azul e branca às riscas", preco: 0, comissao: 1 },
    { name: "camisa xadrez azul e branca", preco: 0, comissao: 1 },
    { name: "camisa xadrez verde-escura", preco: 0, comissao: 1 },
    { name: "camisa xadrez castanha e bege", preco: 0, comissao: 1 },
    { name: "camisola cinzenta clara lisa", preco: 0, comissao: 1 },
    { name: "t-shirt cinzenta com comando retro", preco: 0, comissao: 1 },
    { name: "t-shirt azul royal", preco: 0, comissao: 1 }
  ];

  const START_NUM = 30;
  const END_NUM = START_NUM + items.length - 1;

  let currentIndex = 0;

  function init(){

    const nameEl = document.querySelector('.art-name');
    const numEl = document.querySelector('.num');
    const breakdownEl = document.getElementById('breakdown');
    const priceEl = document.querySelector('.price');

    const currentIdxEl = document.getElementById('current-idx');
    const totalIdxEl = document.getElementById('total-idx');

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    const jumpInput = document.getElementById('jump-input');
    jumpInput.min = START_NUM;
    jumpInput.max = END_NUM;

    function formatEuro(v){
      return v.toFixed(2).replace('.', ',') + '€';
    }

    function render(){

      const item = items[currentIndex];

      const displayNum = currentIndex + START_NUM;

      const total = item.preco + item.comissao;

      nameEl.textContent = item.name;

      numEl.textContent = String(displayNum);

      breakdownEl.textContent = formatEuro(item.preco) + ' + ' + formatEuro(item.comissao);

      priceEl.textContent = formatEuro(total);

      currentIdxEl.textContent = displayNum;

      totalIdxEl.textContent = END_NUM;

      prevBtn.disabled = currentIndex === 0;

      nextBtn.disabled = currentIndex === items.length - 1;
    }

    prevBtn.addEventListener('click', () => {

      if(currentIndex > 0){
        currentIndex--;
        render();
      }

    });

    nextBtn.addEventListener('click', () => {

      if(currentIndex < items.length - 1){
        currentIndex++;
        render();
      }

    });

    document.getElementById('jump-btn').addEventListener('click', () => {

      const val = parseInt(jumpInput.value, 10);

      const idx = val - START_NUM;

      if(idx >= 0 && idx < items.length){
        currentIndex = idx;
        render();
      }

    });

    jumpInput.addEventListener('keydown', (e) => {

      if(e.key === 'Enter'){
        document.getElementById('jump-btn').click();
      }

    });

    document.addEventListener('keydown', (e) => {

      if(e.key === 'ArrowRight'){
        nextBtn.click();
      }

      if(e.key === 'ArrowLeft'){
        prevBtn.click();
      }

    });

    const mirrorBtn = document.getElementById('mirror-toggle');

    mirrorBtn.addEventListener('click', () => {

      document.body.classList.toggle('mirrored');

      mirrorBtn.classList.toggle('active');

    });

    function updateClock(){

      const now = new Date();

      const months = [
        "JAN","FEV","MAR","ABR","MAI","JUN",
        "JUL","AGO","SET","OUT","NOV","DEZ"
      ];

      document.getElementById('clock-date').textContent =
        `${now.getDate()} ${months[now.getMonth()]}`;

      document.getElementById('clock-time').textContent =
        String(now.getHours()).padStart(2,'0') +
        ':' +
        String(now.getMinutes()).padStart(2,'0');

    }

    updateClock();

    setInterval(updateClock, 30000);

    render();

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

</script>

</body>
</html>
