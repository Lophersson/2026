<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIRETO - QUINTA-FEIRA 27 AGOSTO 2026</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root{
    --void:#ffffff;
    --panel:#ffffff;
    --gold:#000000;
    --gold-dim:#333333;
    --ink:#000000;
    --ink-dim:#555555;
    --red:#c62b32;
    --line:#000000;
    --card-bg:#ffffff;
    --card-ink:#000000;

    /* Tamaños móviles (impacto vertical) */
    --name-size: clamp(20px, 6vw, 34px);
    --num-size: clamp(120px, 42vh, 280px);
    --price-size: clamp(40px, 10vh, 70px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px;
    overflow:hidden;
  }
  .stage{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
  }
  header{
    width:100%;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
    margin-bottom: 8px;
    padding-top: 20px;
  }
  .clock{
    position:absolute;
    top:0;
    right:0;
    text-align:right;
    font-family:'DM Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    line-height:1.3;
    text-transform:uppercase;
  }
  .clock .time{
    color:var(--ink);
    font-size:12px;
    font-weight:700;
  }
  .title-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .live-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px 2px rgba(198,43,50,0.5);
    animation:dotpulse 1.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes dotpulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.35; transform:scale(0.8);}
  }
  h1.directo{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: clamp(24px, 7vw, 36px);
    letter-spacing:0.1em;
    margin:0;
    color:var(--ink);
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,45%,100%{opacity:1;}
    50%,90%{opacity:0.22;}
  }
  .subline{
    font-family:'DM Mono', monospace;
    font-size: clamp(10px, 3vw, 13px);
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:2px;
    text-align:center;
  }

  main{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    touch-action: pan-y;
  }

  /* ===== Ficha (grid: se reordena en desktop vía media query) ===== */
  .ficha-vertical {
    width:100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "name"
      "num"
      "price";
    border: 0px solid var(--line);
    background: var(--card-bg);
    color: var(--card-ink);
  }

  /* Bloque Nombre */
  .name-block {
    grid-area: name;
    text-align: center;
    padding: 12px 8px;
    border-bottom: 0px solid var(--line);
  }
  .name-block .art-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: var(--name-size);
    line-height: 1.2;
    outline: none;
    display: block;
    color: #000000;
  }

  /* Bloque Número */
  .num-block {
    grid-area: num;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
  }
  .num-block .num {
    font-family: 'DM Mono', monospace;
    font-weight: 700;
    font-size: var(--num-size);
    line-height: 0.8;
    color: #000000;
    letter-spacing: -0.05em;
  }

  /* Bloque Precio (total = precio + comisión) */
  .price-block {
    grid-area: price;
    text-align: center;
    padding: 12px 8px;
    border-top: 0px solid var(--line);
  }
  .price-block .price {
    font-family: 'DM Mono', monospace;
    font-weight: 700;
    font-size: var(--price-size);
    line-height: 1;
    color: #000000;
    display: inline-block;
  }

  /* ===== DESKTOP / PANTALLA COMPLETA =====
     Nombre arriba (full width) · Número abajo-izquierda · Precio abajo-derecha */
  @media (min-width: 900px){
    :root{
      --name-size: clamp(24px, 4.0vw, 60px);
      --num-size: clamp(180px, 50vh, 500px);
      --price-size: clamp(80px, 20vh, 180px);
    }
    body{ padding:24px; }
    .ficha-vertical{
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "name  name"
        "num   price";
      border-width: 0px;
    }
    .name-block{
      text-align:left;
      padding: 22px 48px;
      border-bottom-width: 0px;
    }
    .num-block{
      justify-content: flex-start;
      padding-left: 56px;
      border-right: 0px solid var(--line);
    }
    .price-block{
      justify-content: flex-end;
      text-align: right;
      padding: 0 56px;
      border-top: none;
      display:flex;
      align-items:center;
    }
    .price-block .price{ width:100%; }
  }

  /* Controles inferiores comprimidos */
  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
    margin-top: 12px;
    width:100%;
    opacity: 0.3;
    transition:opacity 0.2s ease;
  }
  .controls:hover, .controls:focus-within, .controls:active{
    opacity:1;
  }
  .nav {
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:16px;
    width:100%;
  }
  .arrow-btn {
    width:54px;
    height:54px;
    border-radius:12px;
    border:3px solid #000000;
    background:transparent;
    color:#000000;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
  }
  .arrow-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.08); }
  .arrow-btn:disabled { opacity: 0.25; }

  .position {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: var(--ink-dim);
    min-width: 60px;
    text-align: center;
  }
  .position b { color: #000000; font-size:22px; }

  .bottom-row {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }
  .jump {
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:6px;
    font-family:'DM Mono', monospace;
    font-size:14px;
  }
  .jump input {
    width:55px;
    height:40px;
    background:#ffffff;
    border:3px solid #000000;
    color:#000000;
    font-family:'DM Mono', monospace;
    font-size:16px;
    text-align:center;
    border-radius:8px;
  }
  .jump button {
    background:#000000;
    border:3px solid #000000;
    color:#ffffff;
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:0 12px;
    border-radius:8px;
    height:40px;
    display:flex;
    align-items:center;
  }
  .mirror-btn{
    width:40px;
    height:40px;
    border-radius:8px;
    border:3px solid #000000;
    background:transparent;
    color:#000000;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
  }

  body.mirrored .stage{ transform:scaleX(-1); }
  body.mirrored .controls{ transform:scaleX(-1); }
</style>
</head>
<body>

<div class="stage">
  <header>
    <div class="clock">
      <span id="clock-date">27 AGO</span><br>
      <span class="time" id="clock-time">18:15</span>
    </div>
    <div class="title-row">
      <div class="live-dot"></div>
      <h1 class="directo">DIRETO</h1>
    </div>
    <div class="subline">QUINTA-FEIRA 27 AGOSTO 2026</div>
  </header>

  <main>
    <div class="ficha-vertical">
      <div class="name-block">
        <span class="art-name">NOME DO ARTIGO</span>
      </div>

      <div class="num-block">
        <span class="num">30</span>
      </div>

      <div class="price-block">
        <span class="price">0,00€</span>
      </div>
    </div>
  </main>

  <div class="controls">
    <div class="nav">
      <button class="arrow-btn" id="prev-btn">←</button>
      <div class="position"><b id="current-idx">30</b>/<span id="total-idx">51</span></div>
      <button class="arrow-btn" id="next-btn">→</button>
    </div>
    <div class="bottom-row">
      <div class="jump">
        <input type="number" id="jump-input" placeholder="Nº" min="1">
        <button id="jump-btn">IR</button>
      </div>
      <button class="mirror-btn" id="mirror-toggle">⇄</button>
    </div>
  </div>
</div>

<script>
  /* =========================================================
     LISTA DE ARTIGOS — EDITA AQUI
     Cada artigo tem: nome, preco (base) e comissao.
     No ecrã só se mostra o TOTAL = preco + comissao.
     Podes apagar/adicionar linhas livremente (não precisa
     de tocar em mais nada no código).
     ========================================================= */
  const items = [
    { name: "Pack de 2 pares de sapatilhas altas infantis do Stitch", preco: 0.00, comissao: 0.00 },
    { name: "Pack de 2 pares de tamancos cinzentos da PlayStation forrados", preco: 0.00, comissao: 0.00 },
    { name: "Pack de 2 pares de tamancos cor creme com estampado de veículos", preco: 0.00, comissao: 0.00 },
    { name: "Mala tiracolo do Bambi", preco: 0.00, comissao: 0.00 },
    { name: "Pack de 2 pijamas do Ursinho Pooh", preco: 0.00, comissao: 0.00 },
    { name: "Pack de 6 elásticos de cabelo da Gabby Dollhouse", preco: 0.00, comissao: 0.00 },
    { name: "Pendente para telemóvel do Stitch", preco: 0.00, comissao: 0.00 },
    { name: "Estojo do Homem-Aranha", preco: 0.00, comissao: 0.00 },
    { name: "Carteira/porta-moedas verde com ilustração", preco: 0.00, comissao: 0.00 },
    { name: "Conjunto infantil azul claro com arco-íris", preco: 0.00, comissao: 0.00 },
    { name: "Conjunto infantil cor creme com orelhas estilo Mickey", preco: 0.00, comissao: 0.00 },
    { name: "Touca/máscara de dormir do Stitch", preco: 0.00, comissao: 0.00 },
    { name: "Pack de 2 pulseiras laváveis do Stitch", preco: 0.00, comissao: 0.00 },
    { name: "Conjunto de brinquedos Dino Dart", preco: 0.00, comissao: 0.00 },
    { name: "Boiões grandes de creme cosmético cor de laranja", preco: 0.00, comissao: 0.00 },
    { name: "Boião pequeno de bálsamo labial", preco: 0.00, comissao: 0.00 },
    { name: "Máscara labial noturna", preco: 0.00, comissao: 0.00 },
    { name: "Batons Satin Lip Stick", preco: 0.00, comissao: 0.00 },
    { name: "Batons em embalagem rosa", preco: 0.00, comissao: 0.00 },
    { name: "Bálsamos labiais em tubo", preco: 0.00, comissao: 0.00 },
    { name: "Mealheiros com cadeado, personagens infantis", preco: 0.00, comissao: 0.00 },
    { name: "Dispensador de creme de mãos de matcha", preco: 0.00, comissao: 0.00 },
  ];

  /* Número inicial de la numeración en pantalla.
     El array 'items' NO se reordena: el primer elemento
     se mostrará como START_NUM, el segundo como START_NUM+1, etc. */
  const START_NUM = 30;

  let currentIndex = 0;

  const nameEl = document.querySelector('.art-name');
  const numEl = document.querySelector('.num');
  const priceEl = document.querySelector('.price');
  const currentIdxEl = document.getElementById('current-idx');
  const totalIdxEl = document.getElementById('total-idx');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function formatEuro(v){
    return v.toFixed(2).replace('.', ',') + '€';
  }

  function render(){
    const item = items[currentIndex];
    const total = item.preco + item.comissao;
    const displayNum = currentIndex + START_NUM;

    nameEl.textContent = item.name;
    numEl.textContent = String(displayNum);
    priceEl.textContent = formatEuro(total);

    currentIdxEl.textContent = displayNum;
    totalIdxEl.textContent = items.length - 1 + START_NUM;

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === items.length - 1;
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) { currentIndex--; render(); }
  });
  nextBtn.addEventListener('click', () => {
    if (currentIndex < items.length - 1) { currentIndex++; render(); }
  });

  document.getElementById('jump-btn').addEventListener('click', () => {
    const val = parseInt(document.getElementById('jump-input').value, 10);
    const idx = val - START_NUM;
    if (idx >= 0 && idx < items.length) {
      currentIndex = idx;
      render();
    }
  });
  document.getElementById('jump-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('jump-btn').click();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextBtn.click();
    if (e.key === 'ArrowLeft') prevBtn.click();
  });

  const mirrorBtn = document.getElementById('mirror-toggle');
  mirrorBtn.addEventListener('click', () => {
    document.body.classList.toggle('mirrored');
    mirrorBtn.classList.toggle('active');
  });

  function updateClock(){
    const now = new Date();
    const days = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
    const months = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
    document.getElementById('clock-date').textContent = `${now.getDate()} ${months[now.getMonth()]}`;
    document.getElementById('clock-time').textContent =
      String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 30000);

  render();
</script>

</body>
</html>
