<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIRETO - QUARTA-FEIRA 25 NOVEMBRO 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Mono:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --ink-dim:#555555;
    --red:#c62b32;
    --card-bg:#ffffff;
    --card-ink:#000000;
    --name-size: clamp(20px, 6vw, 34px);
    --num-size: clamp(120px, 42vh, 280px);
    --price-size: clamp(36px, 9vh, 62px);
    --breakdown-size: clamp(13px, 3.2vh, 20px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#ffffff;color:var(--ink);font-family:'DM Sans', sans-serif;
    height:100vh;height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:10px;overflow:hidden;
  }
  .stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;}
  header{width:100%;position:relative;display:flex;flex-direction:column;align-items:center;flex:0 0 auto;margin-bottom:8px;padding-top:20px;}
  .clock{
    position:absolute;top:0;right:0;text-align:right;font-family:'DM Mono', monospace;
    font-size:10px;letter-spacing:0.06em;color:var(--ink-dim);line-height:1.3;text-transform:uppercase;
  }
  .clock .time{color:var(--ink);font-size:12px;font-weight:700;}
  .title-row{display:flex;align-items:center;gap:8px;}
  .live-dot{
    width:9px;height:9px;border-radius:50%;background:var(--red);
    box-shadow:0 0 10px 2px rgba(198,43,50,0.5);animation:dotpulse 1.4s ease-in-out infinite;flex-shrink:0;
  }
  @keyframes dotpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.35;transform:scale(0.8);}}
  h1.directo{
    font-family:'Cormorant Garamond', serif;font-weight:700;font-size:clamp(24px, 7vw, 36px);
    letter-spacing:0.1em;margin:0;color:var(--ink);animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{0%,45%,100%{opacity:1;}50%,90%{opacity:0.22;}}
  .subline{
    font-family:'DM Mono', monospace;font-size:clamp(10px, 3vw, 13px);letter-spacing:0.15em;
    text-transform:uppercase;color:var(--ink-dim);margin-top:2px;text-align:center;
  }

  /* Botões fixos em cima à esquerda (não são espelhados) */
  .tools{
    position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:10;
    opacity:0.35;transition:opacity 0.2s ease;
  }
  .tools:hover,.tools:active,.tools:focus-within{opacity:1;}
  .tool-btn{
    width:40px;height:40px;border-radius:8px;border:3px solid #000000;background:#ffffff;color:#000000;
    font-family:'DM Mono', monospace;font-weight:700;font-size:16px;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  .tool-btn:active{transform:scale(0.92);}
  .tool-btn.off{background:#000000;color:#ffffff;text-decoration:line-through;}

  main{
    width:100%;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;touch-action:pan-y;
  }
  .ficha-vertical{
    width:100%;height:100%;display:grid;grid-template-columns:1fr;
    grid-template-rows:auto 1fr auto;grid-template-areas:"name" "num" "price";
    border:0;background:var(--card-bg);color:var(--card-ink);
  }
  .name-block{grid-area:name;text-align:center;padding:12px 8px;}
  .name-block .art-name{
    font-family:'Cormorant Garamond', serif;font-weight:700;font-size:var(--name-size);
    line-height:1.2;outline:none;display:block;color:#000000;
  }
  .num-block{grid-area:num;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;}
  .num-block .num{
    font-family:'DM Mono', monospace;font-weight:700;font-size:var(--num-size);
    line-height:0.8;color:#000000;letter-spacing:-0.05em;
  }
  .price-block{
    grid-area:price;text-align:center;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  body.hide-prices .price-block{visibility:hidden;}
  .price-block .breakdown{
    font-family:'DM Mono', monospace;font-weight:500;font-size:var(--breakdown-size);
    line-height:1.1;color:var(--ink-dim);letter-spacing:0.02em;
  }
  .price-block .price{
    font-family:'DM Mono', monospace;font-weight:700;font-size:var(--price-size);
    line-height:1;color:#000000;display:inline-block;
  }
  @media (min-width:900px){
    :root{
      --name-size:clamp(24px, 4.0vw, 60px);
      --num-size:clamp(180px, 50vh, 500px);
      --price-size:clamp(70px, 17vh, 160px);
      --breakdown-size:clamp(18px, 3vh, 32px);
    }
    body{padding:24px;}
    .tools{top:24px;left:24px;}
    .ficha-vertical{
      grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;
      grid-template-areas:"name name" "num price";
    }
    .name-block{text-align:left;padding:22px 48px;}
    .num-block{justify-content:flex-start;padding-left:56px;}
    .price-block{justify-content:center;align-items:flex-end;text-align:right;padding:0 56px;}
  }
  .controls{
    display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto;
    margin-top:12px;width:100%;opacity:0.3;transition:opacity 0.2s ease;
  }
  .controls:hover,.controls:focus-within,.controls:active{opacity:1;}
  .nav{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:16px;width:100%;}
  .arrow-btn{
    width:54px;height:54px;border-radius:12px;border:3px solid #000000;background:transparent;
    color:#000000;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;
  }
  .arrow-btn:active{transform:scale(0.9);background:rgba(0,0,0,0.08);}
  .arrow-btn:disabled{opacity:0.25;}
  .position{font-family:'DM Mono', monospace;font-size:18px;color:var(--ink-dim);min-width:60px;text-align:center;}
  .position b{color:#000000;font-size:22px;}

  /* Botões quadrados com os números dos artigos */
  .nums{
    display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:100%;
    max-height:22vh;overflow-y:auto;padding:2px;
  }
  .num-btn{
    width:36px;height:36px;border:2px solid #000000;border-radius:6px;background:#ffffff;color:#000000;
    font-family:'DM Mono', monospace;font-weight:700;font-size:13px;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  .num-btn:active{transform:scale(0.92);}
  .num-btn.active{background:#000000;color:#ffffff;}

  body.mirrored .stage{transform:scaleX(-1);}
  body.mirrored .controls{transform:scaleX(-1);}
</style>
</head>

<body class="hide-prices">
<div class="tools">
  <button class="tool-btn off" id="price-toggle" title="Mostrar / ocultar preços">€</button>
  <button class="tool-btn" id="mirror-toggle" title="Espelho">⇄</button>
</div>

<div class="stage">

  <header>
    <div class="clock">
      <span id="clock-date">25 NOV</span><br>
      <span class="time" id="clock-time">20:30</span>
    </div>
    <div class="title-row">
      <div class="live-dot"></div>
      <h1 class="directo">DIRETO</h1>
    </div>
    <div class="subline">QUARTA-FEIRA 25 NOVEMBRO 2026</div>
  </header>

  <main>
    <div class="ficha-vertical">
      <div class="name-block"><span class="art-name">NOME DO ARTIGO</span></div>
      <div class="num-block"><span class="num">30</span></div>
      <div class="price-block">
        <span class="breakdown" id="breakdown"></span>
        <span class="price"></span>
      </div>
    </div>
  </main>

  <div class="controls">
    <div class="nav">
      <button class="arrow-btn" id="prev-btn">←</button>
      <div class="position"><b id="current-idx">30</b>/<span id="total-idx">73</span></div>
      <button class="arrow-btn" id="next-btn">→</button>
    </div>
    <div class="nums" id="nums"></div>
  </div>
</div>

<script>
  // preco = preço inicial | comissao = comissão | Total mostrado = preco + comissao
  const items = [
    { name: "Papel de forno para air fryer", preco: 0, comissao: 1 },
    { name: "Marcadores Van Bleiswijk Twin Marker Set (24 peças)", preco: 0, comissao: 1 },
    { name: "Caneca festiva para pintar", preco: 0, comissao: 1 },
    { name: "Top canelado verde com renda Primark (XL)", preco: 0, comissao: 1 },
    { name: "Top canelado bordeaux com renda Primark (XL)", preco: 0, comissao: 1 },
    { name: "Pijama creme com capibaras", preco: 0, comissao: 1 },
    { name: "erro", preco: 0, comissao: 1 },
    { name: "Conjunto Stitch cinzento e roxo", preco: 0, comissao: 1 },
    { name: "Pijama polar rosa Marie Aristogatos", preco: 0, comissao: 1 },
    { name: "Pijama K-Pop", preco: 0, comissao: 1 },
    { name: "Erro", preco: 0, comissao: 1 },
    { name: "Jogo PS5 Sonic Frontiers", preco: 0, comissao: 1 },
    { name: "Bloco de atividades Gabby's Dollhouse", preco: 0, comissao: 1 },
    { name: "Erro", preco: 0, comissao: 1 },
    { name: "Escovas desembaraçadoras Detangling Brush", preco: 0, comissao: 1 },
    { name: "Hair Care Set with Honey beautydept", preco: 0, comissao: 1 },
    { name: "Esponjas de maquilhagem Blender Sponge Beauty Star", preco: 0, comissao: 1 },
    { name: "Livro de colorir Spidey Multicolor", preco: 0, comissao: 1 },
    { name: "Livro Color by Number Hello Kitty", preco: 0, comissao: 1 },
    { name: "Canetas com figuras fofas", preco: 0, comissao: 1 },
    { name: "Canetas de gel apagáveis K-Pop Demon Hunters", preco: 0, comissao: 1 },
    { name: "Garrafa de água Sanrio", preco: 0, comissao: 1 },
    { name: "Creme de mãos Mango", preco: 0, comissao: 1 },
    { name: "Bálsamos labiais Aloe Vera", preco: 0, comissao: 1 },
    { name: "Pijama Winnie the Pooh de Natal", preco: 0, comissao: 1 },
    { name: "Individual de mesa Rei Leão", preco: 0, comissao: 1 },
    { name: "Individual de mesa pónei unicórnio", preco: 0, comissao: 1 },
    { name: "Champô de arroz Barwa Naturalna", preco: 0, comissao: 1 },
    { name: "Leite corporal Secret Code", preco: 0, comissao: 1 },
    { name: "Rímel Rose Shimmer Glitter", preco: 0, comissao: 1 },
    { name: "Eau de toilette Aire de Sevilla Chicca Bonita", preco: 0, comissao: 1 },
    { name: "Eau de toilette Aire de Sevilla Rosé", preco: 0, comissao: 1 },
    { name: "Garrafas de silicone com animais", preco: 0, comissao: 1 },
    { name: "Eau de parfum Disney Jasmine", preco: 0, comissao: 1 },
    { name: "Espelho LED recarregável", preco: 0, comissao: 1 },
    { name: "Conjunto de banho Wellness & Bath Set", preco: 0, comissao: 1 },
    { name: "Gaiola decorativa com moedas douradas", preco: 0, comissao: 1 },
    { name: "Quebra-nozes decorativos", preco: 0, comissao: 1 },
    { name: "Conjunto de papelaria Hello Kitty and Friends", preco: 0, comissao: 1 },
    { name: "Conjunto de papelaria Stitch", preco: 0, comissao: 1 },
    { name: "Mentos World Flavours", preco: 0, comissao: 1 },
    { name: "Planner roxo", preco: 0, comissao: 1 },
    { name: "Planner verde", preco: 0, comissao: 1 },
    { name: "Planner com palmeiras", preco: 0, comissao: 1 },
  ];

  const START_NUM = 30;
  const END_NUM = START_NUM + items.length - 1;

  let currentIndex = 0;

  function init(){
    const nameEl = document.querySelector('.art-name');
    const numEl = document.querySelector('.num');
    const breakdownEl = document.getElementById('breakdown');
    const priceEl = document.querySelector('.price');
    const currentIdxEl = document.getElementById('current-idx');
    const totalIdxEl = document.getElementById('total-idx');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const numsEl = document.getElementById('nums');

    function formatEuro(v){ return v.toFixed(2).replace('.', ',') + '€'; }

    // Botões quadrados com os números
    const numButtons = items.map((_, i) => {
      const b = document.createElement('button');
      b.className = 'num-btn';
      b.textContent = String(START_NUM + i);
      b.addEventListener('click', () => { currentIndex = i; render(); });
      numsEl.appendChild(b);
      return b;
    });

    function render(){
      const item = items[currentIndex];
      const displayNum = currentIndex + START_NUM;
      const total = item.preco + item.comissao;
      nameEl.textContent = item.name;
      numEl.textContent = String(displayNum);
      const showPrices = !document.body.classList.contains('hide-prices');
      breakdownEl.textContent = showPrices ? formatEuro(item.preco) + ' + ' + formatEuro(item.comissao) : '';
      priceEl.textContent = showPrices ? formatEuro(total) : '';
      currentIdxEl.textContent = displayNum;
      totalIdxEl.textContent = END_NUM;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === items.length - 1;
      numButtons.forEach((b, i) => b.classList.toggle('active', i === currentIndex));
      numButtons[currentIndex].scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    prevBtn.addEventListener('click', () => { if(currentIndex > 0){ currentIndex--; render(); } });
    nextBtn.addEventListener('click', () => { if(currentIndex < items.length - 1){ currentIndex++; render(); } });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowRight'){ nextBtn.click(); }
      if(e.key === 'ArrowLeft'){ prevBtn.click(); }
    });

    // Mostrar / ocultar preços
    const priceBtn = document.getElementById('price-toggle');
    priceBtn.addEventListener('click', () => {
      document.body.classList.toggle('hide-prices');
      priceBtn.classList.toggle('off');
      render();
    });

    // Espelho
    const mirrorBtn = document.getElementById('mirror-toggle');
    mirrorBtn.addEventListener('click', () => {
      document.body.classList.toggle('mirrored');
      mirrorBtn.classList.toggle('off');
    });

    function updateClock(){
      const now = new Date();
      const months = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
      document.getElementById('clock-date').textContent = `${now.getDate()} ${months[now.getMonth()]}`;
      document.getElementById('clock-time').textContent =
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 30000);
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
